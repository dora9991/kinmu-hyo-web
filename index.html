    return r >= q.r0 && r <= q.r1 && d >= q.c0 && d <= q.c1;
  }

  // ───────── キーボード ─────────
  function onKey(e) {
    if (KH.editor.isOpen()) return;
    const mod = e.ctrlKey || e.metaKey;
    const k = e.key;
    if (mod && !e.altKey) {
      const kk = k.toLowerCase();
      if (kk === 'z') { e.preventDefault(); e.shiftKey ? KH.app.redo() : KH.app.undo(); return; }
      if (kk === 'y') { e.preventDefault(); KH.app.redo(); return; }
      if (kk === 'a') { e.preventDefault(); setSel(mo().staff.length - 1, G.days.length, 0, 1); return; }
      if (kk === 'c' || kk === 'x') {
        // copy/cut イベントが来ないブラウザのための予備
        G.copiedByEvent = false;
        setTimeout(() => { if (!G.copiedByEvent && G.sel) copySel(kk === 'x' && isEdit()); }, 0);
        return;
      }
      if (kk === 'v') {
        if (!isEdit()) return;
        clearTimeout(G.pasteWait);
        G.pasteWait = setTimeout(() => { if (G.clip) pasteBlock(G.clip.cells); }, 60);
        return;
      }
      if (kk === 'p') { e.preventDefault(); KH.print.open(); return; }
      return;
    }
    switch (k) {
      case 'ArrowLeft': e.preventDefault(); return moveBy(0, -1, e.shiftKey);
      case 'ArrowRight': e.preventDefault(); return moveBy(0, 1, e.shiftKey);
      case 'ArrowUp': e.preventDefault(); return moveBy(-1, 0, e.shiftKey);
      case 'ArrowDown': e.preventDefault(); return moveBy(1, 0, e.shiftKey);
      case 'Tab': e.preventDefault(); return moveBy(0, e.shiftKey ? -1 : 1, false);
      case 'Home': e.preventDefault(); return G.sel && setSel(G.sel.r1, 1);
      case 'End': e.preventDefault(); return G.sel && setSel(G.sel.r1, G.days.length);
      case 'Escape':
        if (G.sel && selCount() > 1) setSel(G.sel.r1, G.sel.c1);
        return;
      case 'Enter':
      case 'F2':
        e.preventDefault();
        if (!G.sel) return setSel(0, 1);
        if (isEdit()) openEditor();
        else KH.app.openPerson(mo().staff[G.sel.r1].id);
        return;
      case 'Delete':
      case 'Backspace':
        e.preventDefault();
        return clearSel();
    }
    if (e.altKey) return;
    if (k === '@' || (k === 'Process' && e.code === 'BracketLeft')) {
      e.preventDefault();
      if (isEdit() && G.sel) KH.editor.startTimeOnly(selTargets(), G.cells[G.sel.r1][G.sel.c1].getBoundingClientRect());
      return;
    }
    const code = codeForKey(e);
    if (code) {
      e.preventDefault();
      if (!G.sel) setSel(0, 1);
      applyCode(code.id);
    }
  }

  // ───────── 下の入力パレット ─────────
  function keyHint(c) {
    if (!c.key) return '';
    return (c.shift ? '⇧' : '') + c.key.toUpperCase();
  }

  function chipHTML(c, extra) {
    const cls = ['chip', 'k-' + c.kind];
    if (c.color) cls.push('col-' + c.color);
    const nm = c.kind === 'work' ? c.name || (c.start && c.end ? c.start + '〜' : '') : c.name || '';
    const tip = M.describeCode(c) + (c.key ? '\nキー：' + (c.shift ? 'Shift + ' : '') + c.key.toUpperCase() : '');
    return '<button class="' + cls.join(' ') + (extra || '') + '" data-code="' + esc(c.id) + '" title="' + esc(tip) + '"><b>' + esc(c.label) + '</b><small>' + esc(nm) + '</small>' + (c.key ? '<kbd>' + esc(keyHint(c)) + '</kbd>' : '') + '</button>';
  }

  function renderDock() {
    const dock = document.getElementById('dock');
    if (!dock) return;
    if (KH.app.view() !== 'grid') { dock.hidden = true; return; }
    dock.hidden = false;
    const m = mo();
    const cm = M.codeMap(m);
    if (!isEdit()) {
      let h = '<div class="dock-row"><div class="legend-line">';
      for (const c of m.codes) {
        if (c.kind !== 'work') continue;
        h += '<span class="lg"><span class="sw' + (c.color ? ' col-' + c.color : '') + '">' + esc(c.label) + '</span>' + esc((c.name ? c.name + ' ' : '') + c.start + '〜' + c.end) + '</span>';
      }
      for (const t of m.tags) h += '<span class="lg"><span class="sw col-' + esc(t.color) + '">&nbsp;</span>' + esc(t.name) + '</span>';
      h += '<span class="lg"><span class="sw dayc">&nbsp;</span>土・日・祝</span>';
      h += '</div></div><div class="dock-row"><div class="selinfo">' + selInfoHTML(m, cm) + '</div></div>';
      dock.innerHTML = h;
      return;
    }
    let h = '<div class="dock-row"><div class="palette" id="palette">';
    for (const c of m.codes) {
      if (c.kind !== 'work') continue;
      h += chipHTML(c);
    }
    h += '<span class="sep"></span>';
    for (const c of m.codes) if (c.kind !== 'work') h += chipHTML(c);
    h += '<span class="sep"></span>';
    h += '<button class="chip special" data-act="time" title="記号を使わず「9:00〜11:00」のように時間だけで入れる（キー：@）"><b>⏱</b><small>時間だけ</small><kbd>@</kbd></button>';
    h += '<button class="chip special" data-act="clear" title="選んだマスを空にする（Delete）"><b>⌫</b><small>消す</small><kbd>Del</kbd></button>';
    h += '</div></div>';
    const adv = ST.pref('adv') || 'right';
    h += '<div class="dock-row"><div class="selinfo">' + selInfoHTML(m, cm) + '</div>';
    h += '<button class="btn small" data-act="detail" title="時間の変更・色（理由）・メモ（Enter／ダブルクリック／右クリック）">時間・色・メモ… <kbd>Enter</kbd></button>';
    h += '<span class="lbl-s">入力したら</span><span class="seg" role="group"><button data-adv="right" class="' + (adv === 'right' ? 'on' : '') + '" title="1マス入れたら右（次の日）へ。日曜・祝日はとばします">→ 次の日</button><button data-adv="down" class="' + (adv === 'down' ? 'on' : '') + '" title="1マス入れたら下（次の人）へ">↓ 次の人</button><button data-adv="none" class="' + (adv === 'none' ? 'on' : '') + '" title="動かない">止まる</button></span>';
    h += '</div>';
    dock.innerHTML = h;
    // いまのマスの記号を強調
    if (G.sel && selCount() === 1) {
      const st = m.staff[G.sel.r1];
      const cell = st && m.cells[st.id] && m.cells[st.id][G.sel.c1];
      if (cell && cell.c) {
        const b = dock.querySelector('.chip[data-code="' + CSS.escape(cell.c) + '"]');
        if (b) b.classList.add('on');
      }
    }
  }

  function selInfoHTML(m, cm) {
    if (!G.sel) return '<span class="muted">' + (isEdit() ? 'マスをクリックして選び、記号のボタンかキーボード（R・B・E・I…）で入力します。ドラッグで広く選べます。' : 'マスをクリックすると、ここにくわしい時間が出ます。') + '</span>';
    const q = rect();
    const n = (q.r1 - q.r0 + 1) * (q.c1 - q.c0 + 1);
    if (n > 1) {
      const people = q.r1 - q.r0 + 1, dd = q.c1 - q.c0 + 1;
      return '<span class="who">' + people + '人 × ' + dd + '日 = ' + n + 'マス</span> <span class="muted">を選択中 ─ 記号を押すとまとめて入ります。「時間・色・メモ…」で終わりの時刻などをまとめて変えられます。</span>';
    }
    const st = m.staff[G.sel.r1];
    const di = G.days[G.sel.c1 - 1];
    if (!st || !di) return '';
    const cell = m.cells[st.id] && m.cells[st.id][di.d];
    const desc = KH.app.describeCell(m, cm, st, di, cell, true);
    const ev = m.events[di.d];
    return '<span class="who">' + esc(st.name) + '</span> <span class="muted">' + m.m + '月' + di.d + '日（' + di.wd + '）</span>　' + desc + (ev ? '　<span class="ev">📌 ' + esc(ev) + '</span>' : '');
  }

  function onDockClick(e) {
    const chip = e.target.closest('.chip[data-code]');
    if (chip) { applyCode(chip.dataset.code); G.wrap && G.wrap.focus({ preventScroll: true }); return; }
    const act = e.target.closest('[data-act]');
    if (act) {
      const a = act.dataset.act;
      if (a === 'clear') { clearSel(); G.wrap.focus({ preventScroll: true }); }
      if (a === 'detail') { if (!G.sel) KH.app.toast('先に表のマスをクリックしてください'); else openEditor(); }
      if (a === 'time') {
        if (!G.sel) return KH.app.toast('先に表のマスをクリックしてください');
        const td = G.cells[G.sel.r1][G.sel.c1];
        KH.editor.startTimeOnly(selTargets(), td.getBoundingClientRect());
      }
      return;
    }
    const adv = e.target.closest('[data-adv]');
    if (adv) { ST.pref('adv', adv.dataset.adv); renderDock(); G.wrap && G.wrap.focus({ preventScroll: true }); }
  }

  // ───────── 組み込み ─────────
  function mount(main) {
    main.innerHTML = '';
    if (!isEdit() && !ST.pref('tipViewDone')) {
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.innerHTML = '<span>👁 <b>見るだけ</b>になっています。<b>名前</b>をクリックでその人の1か月、<b>日付</b>をクリックでその日の配置（何時に何人いるか）が見られます。書きかえるときは右上の「👁 見るだけ」を押します。</span><button class="btn small ghost x" title="閉じる">✕</button>';
      tip.querySelector('.x').onclick = () => { ST.pref('tipViewDone', true); tip.remove(); };
      main.appendChild(tip);
    }
    if (isEdit() && !ST.pref('tipDone')) {
      const tip = document.createElement('div');
      tip.className = 'tip';
      tip.innerHTML = '<span>💡 <b>使い方</b>：マスをクリック → 下の記号ボタンを押す（またはキーボードで <kbd>R</kbd> <kbd>B</kbd> <kbd>E</kbd>…、色つきは <kbd>Shift</kbd>+文字）。入れると自動で次の日へ進みます。時間の変更は <kbd>Enter</kbd> か ダブルクリック。まちがえたら <kbd>Ctrl</kbd>+<kbd>Z</kbd>（⌘Z）。</span><button class="btn small primary" data-demo title="練習用の架空のデータで、画面が自動で動いて使い方を見せます">▶ 使い方のデモを見る</button><button class="btn small ghost x" title="閉じる">✕</button>';
      tip.querySelector('.x').onclick = () => { ST.pref('tipDone', true); tip.remove(); };
      tip.querySelector('[data-demo]').onclick = () => KH.tour.start();
      main.appendChild(tip);
    }
    const wrap = document.createElement('div');
    wrap.className = 'grid-wrap';
    wrap.tabIndex = 0;
    wrap.setAttribute('aria-label', '勤務割表');
    main.appendChild(wrap);
    G.wrap = wrap;
    wrap.addEventListener('mousedown', onDown);
    wrap.addEventListener('mouseover', onOver);
    wrap.addEventListener('mouseleave', () => { for (const el of G.hover.els) el.classList.remove('hl', 'hc'); G.hover = { r: -1, d: -1, els: [] }; });
    wrap.addEventListener('dblclick', onDbl);
    wrap.addEventListener('contextmenu', onCtx);
    wrap.addEventListener('keydown', onKey);
    render();
    const key = mo().y + '-' + mo().m;
    if (G.lastScroll && G.lastScroll.key === key) { wrap.scrollLeft = G.lastScroll.left; wrap.scrollTop = G.lastScroll.top; }
    else if (G.sel) scrollToCell(G.sel.r1, G.sel.c1);
    wrap.addEventListener('scroll', () => { G.lastScroll = { key: mo().y + '-' + mo().m, left: wrap.scrollLeft, top: wrap.scrollTop }; }, { passive: true });
    wrap.focus({ preventScroll: true });
  }

  let bound = false;
  function bindGlobal() {
    if (bound) return;
    bound = true;
    window.addEventListener('mouseup', onUp);
    document.addEventListener('copy', onCopy);
    document.addEventListener('cut', onCopy);
    document.addEventListener('paste', onPaste);
    document.getElementById('dock').addEventListener('click', onDockClick);
  }

  // 練習用のデータへ出入りするとき：選択・コピーを持ちこさない
  function reset() {
    G.sel = null;
    G.clip = null;
    G.painted = [];
    G.lastScroll = null;
    G.hover = { r: -1, d: -1, els: [] };
    G.dragging = false;
  }

  KH.grid = {
    G, reset, mount, render, renderDock, bindGlobal, setSel, selTargets, rect, applyCode, clearSel, scrollToCell,
    focus: () => G.wrap && G.wrap.focus({ preventScroll: true }),
    cellRect: (r, d) => (G.cells[r] && G.cells[r][d] ? G.cells[r][d].getBoundingClientRect() : null),
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// マスの詳しい編集（時間の変更・休憩・過不足・色・メモ）と、日の編集（行事・休園日）
(function (g) {
  const KH = (g.KH = g.KH || {});
  const U = KH.util;
  const M = KH.model;
  const ST = KH.store;
  const esc = U.esc;

  const E = { el: null, targets: [], multi: false, anchor: null, mode: '', pendingTime: false, day: 0, onDoc: null };
  const mo = () => ST.S.mo;

  const END_Q = ['12:00', '15:00', '16:00', '17:00', '17:30', '18:00', '18:30', '19:00', '20:00', '20:45', '21:00'];
  const START_Q = ['6:30', '7:00', '7:15', '7:45', '8:00', '8:30', '9:00'];
  const XB = [[0, 'なし'], [0.5, '30分'], [0.75, '45分'], [1, '1時間']];

  function isEmptyCell(c) {
    return !c || (!c.c && !c.s && !c.e && typeof c.h !== 'number' && !c.n && !c.tag);
  }

  function place(el, r) {
    const W = window.innerWidth, H = window.innerHeight;
    el.style.left = '0px';
    el.style.top = '0px';
    el.hidden = false;
    const w = el.offsetWidth, h = el.offsetHeight;
    // まずマスの右か左に出す（表が隠れにくい）。入らなければ下・上
    let x, y;
    if (r.right + 12 + w <= W - 8) x = r.right + 12;
    else if (r.left - 12 - w >= 8) x = r.left - 12 - w;
    if (x != null) {
      y = Math.max(8, Math.min(H - h - 8, r.top - 60));
    } else {
      x = Math.max(8, Math.min(W - w - 8, r.left + r.width / 2 - w / 2));
      y = r.bottom + 8;
      if (y + h > H - 8) y = r.top - h - 8 >= 8 ? r.top - h - 8 : Math.max(8, H - h - 8);
    }
    el.style.left = Math.round(x) + 'px';
    el.style.top = Math.round(y) + 'px';
  }

  function ensureEl() {
    if (E.el) return E.el;
    const el = document.createElement('div');
    el.className = 'pop';
    el.id = 'pop';
    el.hidden = true;
    el.tabIndex = -1;
    el.setAttribute('role', 'dialog');
    document.body.appendChild(el);
    el.addEventListener('click', onClick);
    el.addEventListener('change', onChange);
    el.addEventListener('keydown', onKey);
    E.el = el;
    return el;
  }

  function isOpen() {
    return !!(E.el && !E.el.hidden);
  }

  function close(keepFocus) {
    if (!E.el || E.el.hidden) return;
    const a = document.activeElement;
    if (a && E.el.contains(a) && (a.tagName === 'INPUT' || a.tagName === 'TEXTAREA')) a.blur(); // 入力中の値を確定
    E.el.hidden = true;
    E.el.innerHTML = '';
    E.mode = '';
    E.pendingTime = false;
    document.removeEventListener('mousedown', E.onDoc, true);
    KH.grid.renderDock();
    if (!keepFocus) KH.grid.focus();
  }

  function openCommon(anchor) {
    const el = ensureEl();
    E.anchor = anchor;
    document.removeEventListener('mousedown', E.onDoc, true);
    E.onDoc = (e) => {
      if (E.el.contains(e.target)) return;
      if (e.target.closest && e.target.closest('.menu, .modal-bg')) return;
      close(true);
    };
    setTimeout(() => document.addEventListener('mousedown', E.onDoc, true), 0);
    return el;
  }

  // ───────── マスの編集 ─────────
  function open(targets, anchor, opt) {
    if (!targets || !targets.length) return;
    opt = opt || {};
    const el = openCommon(anchor);
    E.mode = 'cell';
    E.targets = targets;
    E.multi = targets.length > 1;
    E.pendingTime = !!opt.pendingTime;
    render();
    place(el, anchor);
    focusDefault(opt.focus);
  }

  function startTimeOnly(targets, anchor) {
    open(targets, anchor, { pendingTime: true, focus: 's' });
  }

  function current() {
    const m = mo();
    const t = E.targets[0];
    const cell = m.cells[t.st.id] && m.cells[t.st.id][t.d];
    return { m, t, cell: cell || null, cm: M.codeMap(m) };
  }

  function focusDefault(which) {
    const el = E.el;
    let f = which ? el.querySelector('[data-f="' + which + '"]') : null;
    if (!f) {
      const { cell, cm } = current();
      const k = kindOf(cell, cm);
      if (k === 'time') f = el.querySelector('[data-f="s"]');
      else if (k === 'work' || E.multi) f = el.querySelector('[data-f="e"]');
    }
    if (f) {
      f.focus();
      if (f.select) f.select();
    } else if (el.querySelector('.x')) el.querySelector('.x').focus();
  }

  function kindOf(cell, cm) {
    if (E.pendingTime) return 'time';
    if (!cell) return 'empty';
    if (cell.c) {
      const c = cm.get(cell.c);
      return c ? c.kind : 'unknown';
    }
    if (cell.s || cell.e) return 'time';
    return cell.n || cell.tag || typeof cell.h === 'number' ? 'misc' : 'empty';
  }

  function recentRanges(m) {
    const cnt = new Map();
    const add = (s, e) => {
      const k = U.normTime(s) + '〜' + U.normTime(e);
      cnt.set(k, (cnt.get(k) || 0) + 1);
    };
    for (const st of m.staff) {
      const row = m.cells[st.id] || {};
      for (const d in row) {
        const c = row[d];
        if (c && !c.c && c.s && c.e) add(c.s, c.e);
      }
      if (!st.def && st.defS && st.defE) add(st.defS, st.defE);
    }
    return [...cnt.entries()].sort((a, b) => b[1] - a[1]).slice(0, 6).map((x) => x[0]);
  }

  function chips(m, curId, withTime) {
    let h = '<div class="mini-pal">';
    for (const c of m.codes) {
      const cls = ['chip', 'k-' + c.kind];
      if (c.color) cls.push('col-' + c.color);
      if (c.id === curId) cls.push('on');
      const nm = c.kind === 'work' ? c.name || c.start + '〜' : c.name;
      h += '<button class="' + cls.join(' ') + '" data-code="' + esc(c.id) + '" title="' + esc(M.describeCode(c)) + '"><b>' + esc(c.label) + '</b><small>' + esc(nm || '') + '</small></button>';
    }
    if (withTime) h += '<button class="chip special' + (curId === '' ? ' on' : '') + '" data-act="timeonly" title="記号を使わず時間だけで入れる"><b>⏱</b><small>時間だけ</small></button>';
    return h + '</div>';
  }

  function tagsHTML(m, tag) {
    return '<div class="tags"><button class="tagb' + (tag === '' ? ' on' : '') + '" data-tag="">なし</button>' +
      m.tags.map((tg) => '<button class="tagb col-' + esc(tg.color) + (tag === tg.id ? ' on' : '') + '" data-tag="' + esc(tg.id) + '">' + esc(tg.name) + '</button>').join('') + '</div>';
  }
  function xbHTML(xb) {
    return '<div class="tags">' + XB.map(([v, l]) => '<button class="tagb' + (xb === v ? ' on' : '') + '" data-xb="' + v + '">' + l + '</button>').join('') + '</div>';
  }

  function render() {
    if (E.multi) return renderMulti();
    const { m, t, cell, cm } = current();
    const st = t.st;
    const di = M.dayInfos(m)[t.d - 1];
    const kind = kindOf(cell, cm);
    const code = cell && cell.c ? cm.get(cell.c) : null;
    const inf = M.cellInfo(m, cell, cm, st);
    const ev = m.events[t.d];
    let h = '<div class="pop-head"><div><div class="ttl">' + esc(st.name) + '</div><div class="sub">' + m.m + '月' + t.d + '日（' + di.wd + '）' + (di.hol ? ' ' + esc(di.hol) : '') + '</div>' + (ev ? '<span class="evb">📌 ' + esc(ev) + '</span>' : '') + '</div><button class="btn small ghost x" data-act="close" title="閉じる（Esc）">✕</button></div>';

    const curId = kind === 'time' ? '' : cell && cell.c ? cell.c : null;
    h += '<div class="pop-sec"><div class="lbl">記号</div>' + chips(m, curId, true) + '</div>';

    if (kind === 'work' || kind === 'time') {
      const isWork = kind === 'work';
      const own = isWork || (cell && !cell.c);
      const sv = own && cell && cell.s ? U.normTime(cell.s) : '';
      const ev2 = own && cell && cell.e ? U.normTime(cell.e) : '';
      h += '<div class="pop-sec"><div class="lbl">' + (isWork ? '時間の変更 <span class="hint">いつも ' + esc(code.start + '〜' + code.end) + '（' + U.fmtH(code.hours) + '時間）</span>' : '時間だけの勤務 <span class="hint">例：9:00〜11:00、14:30〜（終わり未定）</span>') + '</div>';
      h += '<div class="trow"><input class="tin' + (isWork && sv ? ' chg' : '') + '" data-f="s" inputmode="numeric" autocomplete="off" placeholder="' + esc(isWork ? code.start : '始まり') + '" value="' + esc(sv) + '" aria-label="始まり"> 〜 <input class="tin' + (isWork && ev2 ? ' chg' : '') + '" data-f="e" inputmode="numeric" autocomplete="off" placeholder="' + esc(isWork ? code.end : '終わり') + '" value="' + esc(ev2) + '" aria-label="終わり">';
      if (isWork && (sv || ev2)) h += ' <button class="btn small" data-act="resetTime">いつもの時間に戻す</button>';
      h += '</div>';
      if (isWork) {
        h += '<div class="quick"><span class="ql">終わりを</span>' + END_Q.map((x) => '<button class="q" data-e="' + x + '">' + x + '</button>').join('') + '</div>';
        h += '<div class="quick"><span class="ql">始まりを</span>' + START_Q.map((x) => '<button class="q" data-s="' + x + '">' + x + '</button>').join('') + '</div>';
      } else {
        const rr = recentRanges(m);
        if (rr.length) h += '<div class="quick"><span class="ql">よく使う</span>' + rr.map((x) => '<button class="q" data-range="' + x + '">' + x + '</button>').join('') + '</div>';
        h += '<div class="note-s">時間だけの勤務は、原本と同じく「計」の日数には入れず、時間を「過不足」に足します。</div>';
      }
      h += '</div>';
      h += '<div class="pop-sec"><div class="lbl">休憩の追加 <span class="hint">残業の日などに足す分</span></div>' + xbHTML((cell && cell.xb) || 0) + '</div>';
    }

    if (kind !== 'empty') {
      const man = cell && typeof cell.h === 'number';
      const val = inf.adj || 0;
      const auto = kind === 'work' || kind === 'time';
      h += '<div class="pop-sec"><div class="lbl">過不足（この日の増減）</div><div class="adjbox">';
      h += '<span class="big ' + (val < 0 ? 'neg' : val > 0 ? 'pos' : '') + '">' + (val ? U.fmtH(val, true) : '0') + ' 時間</span>';
      if (man) h += '<span class="muted">手入力</span><input class="num" type="number" step="0.25" data-f="h" value="' + esc(cell.h) + '" aria-label="過不足"> <button class="btn small" data-act="autoH">' + (auto ? '自動計算に戻す（' + U.fmtH(inf.auto, true) + '）' : '手入力をやめる') + '</button>';
      else h += '<span class="muted">' + (auto ? '自動計算' : '') + '</span><button class="btn small" data-act="manualH">手で入れる</button>';
      h += '</div>';
      if (kind === 'paid') h += '<div class="note-s">有給は「時間数」に ' + U.fmtH(inf.hours) + '時間 入ります（職員の設定「有給1日」）。</div>';
      h += '</div>';
      h += '<div class="pop-sec"><div class="lbl">色（理由）</div>' + tagsHTML(m, (cell && cell.tag) || '') + '</div>';
    }
    const note = (cell && cell.n) || '';
    h += '<div class="pop-sec"><div class="lbl">メモ <span class="hint">マスの下に小さく出ます</span></div><div class="trow"><input class="txt" style="flex:1" data-f="n" value="' + esc(note) + '" placeholder="例：未満児、以上児"> ' + ['未満児', '以上児'].map((x) => '<button class="btn small" data-note="' + x + '">' + x + '</button>').join('') + '</div></div>';
    h += '<div class="pop-foot"><button class="btn danger" data-act="clear">このマスを空にする</button><button class="btn primary" data-act="close">OK <kbd>Enter</kbd></button></div>';
    E.el.innerHTML = h;
  }

  function renderMulti() {
    const m = mo();
    const q = KH.grid.rect();
    const people = q.r1 - q.r0 + 1, dd = q.c1 - q.c0 + 1;
    const cm = M.codeMap(m);
    let hasWork = 0;
    for (const t of E.targets) {
      const cell = m.cells[t.st.id] && m.cells[t.st.id][t.d];
      const c = cell && cell.c ? cm.get(cell.c) : null;
      if ((c && c.kind === 'work') || (cell && !cell.c && (cell.s || cell.e))) hasWork++;
    }
    const P = E.pendingTime;
    let h = '<div class="pop-head"><div><div class="ttl">まとめて変える</div><div class="sub">' + people + '人 × ' + dd + '日（' + E.targets.length + 'マス）・' + m.m + '月' + q.c0 + '日' + (dd > 1 ? '〜' + q.c1 + '日' : '') + '</div></div><button class="btn small ghost x" data-act="close">✕</button></div>';
    h += '<div class="pop-sec"><div class="lbl">記号をまとめて入れる</div>' + chips(m, P ? '' : null, true) + '</div>';
    if (P) {
      h += '<div class="pop-sec"><div class="lbl">時間だけの勤務をまとめて入れる</div>';
      h += '<div class="trow"><input class="tin" data-f="s" inputmode="numeric" placeholder="始まり"> 〜 <input class="tin" data-f="e" inputmode="numeric" placeholder="終わり"></div>';
      const rr = recentRanges(m);
      if (rr.length) h += '<div class="quick"><span class="ql">よく使う</span>' + rr.map((x) => '<button class="q" data-range="' + x + '">' + x + '</button>').join('') + '</div>';
      h += '<div class="note-s">選んだ ' + E.targets.length + 'マスすべてが、この時間の勤務になります。</div></div>';
    } else {
      h += '<div class="pop-sec"><div class="lbl">時間をそろえる <span class="hint">勤務のあるマス（' + hasWork + '）だけ変わります</span></div>';
      h += '<div class="trow"><input class="tin" data-f="s" inputmode="numeric" placeholder="始まり"> 〜 <input class="tin" data-f="e" inputmode="numeric" placeholder="終わり"> <button class="btn small" data-act="resetTime">いつもの時間に戻す</button></div>';
      h += '<div class="quick"><span class="ql">終わりを</span>' + END_Q.map((x) => '<button class="q" data-e="' + x + '">' + x + '</button>').join('') + '</div>';
      h += '<div class="note-s">例：「前日準備19時まで」の日は、その日の列（日付をクリック）を選んで 終わり＝19:00。一人ひとりの勤務から過不足を自動で計算します。</div></div>';
      h += '<div class="pop-sec"><div class="lbl">休憩の追加</div>' + xbHTML(null) + '</div>';
    }
    h += '<div class="pop-sec"><div class="lbl">色（理由）</div>' + tagsHTML(m, null) + '</div>';
    h += '<div class="pop-sec"><div class="lbl">メモ</div><div class="trow"><input class="txt" style="flex:1" data-f="n" placeholder="まとめて同じメモ"> ' + ['未満児', '以上児'].map((x) => '<button class="btn small" data-note="' + x + '">' + x + '</button>').join('') + '</div></div>';
    h += '<div class="pop-foot"><button class="btn danger" data-act="clear">' + E.targets.length + 'マスを空にする</button><button class="btn primary" data-act="close">OK</button></div>';
    E.el.innerHTML = h;
  }

  // ───────── 変更を反映 ─────────
  function update(label, fn) {
    const cm = M.codeMap(mo());
    return ST.commit(label, (mm) => {
      for (const t of E.targets) {
        const row = mm.cells[t.st.id] || (mm.cells[t.st.id] = {});
        const cur = row[t.d] ? U.clone(row[t.d]) : null;
        const next = fn(cur, t, cm);
        if (next === undefined) continue;
        if (isEmptyCell(next)) delete row[t.d];
        else row[t.d] = next;
      }
    });
  }

  function setTimeField(which, raw) {
    const val = raw === '' ? '' : U.normTime(raw);
    if (raw !== '' && !val) {
      KH.app.toast('時刻が読めませんでした（例：17:30、1730）');
      return false;
    }
    const pending = E.pendingTime;
    update(which === 's' ? '始まりの時間' : '終わりの時間', (cell, t, cm) => {
      const code = cell && cell.c ? cm.get(cell.c) : null;
      if (pending) {
        // 「時間だけ」の勤務にする（記号は外す。メモと色は残す）
        const nc = cell && !cell.c ? cell : { c: '' };
        if (cell && cell.c) {
          if (cell.n) nc.n = cell.n;
          if (cell.tag) nc.tag = cell.tag;
        }
        if (val) nc[which] = val;
        else delete nc[which];
        delete nc.h;
        return nc;
      }
      if (!cell) return undefined;
      if (!code) {
        if (cell.c) return undefined;
        if (val) cell[which] = val;
        else delete cell[which];
        delete cell.h;
        return cell;
      }
      if (code.kind !== 'work') return undefined;
      const std = which === 's' ? code.start : code.end;
      if (!val || U.parseTime(val) === U.parseTime(std)) delete cell[which];
      else cell[which] = val;
      delete cell.h;
      return cell;
    });
    if (pending && !E.multi) {
      const { cell } = current();
      if (cell && !cell.c && (cell.s || cell.e)) E.pendingTime = false;
    }
    return true;
  }

  function onChange(e) {
    const f = e.target.dataset.f;
    if (!f) return;
    if (E.mode === 'day') return dayChange(e);
    const v = e.target.value.trim();
    if (f === 's' || f === 'e') {
      if (E.multi && v === '') return;
      setTimeField(f, v);
    } else if (f === 'h') {
      const n = parseFloat(U.toHalf(v));
      update('過不足の手入力', (cell) => {
        cell = cell || { c: '' };
        if (isNaN(n)) delete cell.h;
        else cell.h = Math.round(n * 100) / 100;
        return cell;
      });
    } else if (f === 'n') {
      update('メモ', (cell) => {
        if (!cell && !v) return undefined;
        cell = cell || { c: '' };
        if (v) cell.n = v;
        else delete cell.n;
        return cell;
      });
    }
    refresh();
  }

  // 入力欄のフォーカスを保ったまま、表示を作り直す
  function refresh() {
    if (!isOpen()) return;
    const a = document.activeElement;
    const af = a && E.el.contains(a) ? a.dataset.f : null;
    const pos = a && typeof a.selectionStart === 'number' ? a.selectionStart : null;
    const scroll = E.el.scrollTop;
    const keepVals = {};
    if (E.multi) for (const el of E.el.querySelectorAll('input[data-f]')) keepVals[el.dataset.f] = el.value;
    render();
    E.el.scrollTop = scroll;
    if (E.multi) for (const k in keepVals) { const el = E.el.querySelector('[data-f="' + k + '"]'); if (el) el.value = keepVals[k]; }
    const el = af ? E.el.querySelector('[data-f="' + af + '"]') : null;
    if (el) {
      el.focus();
      try { if (pos != null) el.setSelectionRange(pos, pos); } catch (err) { /* number 欄 */ }
    } else if (!E.el.contains(document.activeElement)) E.el.focus({ preventScroll: true }); // Esc・Enter が効くように
  }

  function onClick(e) {
    const b = e.target.closest('button');
    if (!b) return;
    if (E.mode === 'day') return dayClick(b);
    const d = b.dataset;
    if (d.code !== undefined) {
      const id = d.code;
      const code = mo().codes.find((c) => c.id === id);
      update((code ? code.label : '') + ' を入力', (cell) => {
        const nc = { c: id };
        if (cell && cell.n) nc.n = cell.n;
        return nc;
      });
      E.pendingTime = false;
      if (E.multi) return close();
      refresh();
      if (code && code.kind === 'work') focusDefault('e');
      return;
    }
    if (d.act === 'timeonly') {
      E.pendingTime = true;
      render();
      focusDefault('s');
      return;
    }
    if (d.e) { setTimeField('e', d.e); refresh(); return; }
    if (d.s) { setTimeField('s', d.s); refresh(); return; }
    if (d.range) {
      const [s, e2] = d.range.split('〜');
      update('時間だけの勤務', (cell) => {
        const nc = { c: '', s, e: e2 };
        if (cell && cell.n) nc.n = cell.n;
        if (cell && cell.tag) nc.tag = cell.tag;
        return nc;
      });
      if (!E.multi) E.pendingTime = false;
      refresh();
      return;
    }
    if (d.xb !== undefined) {
      const v = +d.xb;
      update('休憩の追加', (cell, t, cm) => {
        if (!cell) return undefined;
        const code = cell.c ? cm.get(cell.c) : null;
        if (code && code.kind !== 'work') return undefined;
        if (!code && cell.c) return undefined;
        if (v) cell.xb = v;
        else delete cell.xb;
        delete cell.h;
        return cell;
      });
      refresh();
      return;
    }
    if (d.tag !== undefined) {
      const v = d.tag;
      update('色（理由）', (cell) => {
        if (!cell) return E.multi || !v ? undefined : { c: '', tag: v };
        if (v) cell.tag = v;
        else delete cell.tag;
        return cell;
      });
      refresh();
      return;
    }
    if (d.note !== undefined) {
      update('メモ', (cell) => {
        cell = cell || { c: '' };
        cell.n = d.note;
        return cell;
      });
      refresh();
      return;
    }
    switch (d.act) {
      case 'close':
        return close();
      case 'clear':
        update('マスを空にする', () => null);
        return close();
      case 'resetTime':
        update('いつもの時間に戻す', (cell, t, cm) => {
          if (!cell) return undefined;
          const code = cell.c ? cm.get(cell.c) : null;
          if (!code || code.kind !== 'work') return undefined;
          delete cell.s;
          delete cell.e;
          delete cell.xb;
          delete cell.h;
          return cell;
        });
        refresh();
        return;
      case 'manualH': {
        const { m, cell, cm, t } = current();
        const inf = M.cellInfo(m, cell, cm, t.st);
        update('過不足の手入力', (c) => {
          c = c || { c: '' };
          c.h = inf.adj || 0;
          return c;
        });
        refresh();
        const el = E.el.querySelector('[data-f="h"]');
        if (el) { el.focus(); el.select(); }
        return;
      }
      case 'autoH':
        update('過不足を自動に戻す', (c) => {
          if (!c) return undefined;
          delete c.h;
          return c;
        });
        refresh();
        return;
    }
  }

  function onKey(e) {
    if (e.key === 'Escape') {
      e.preventDefault();
      e.stopPropagation();
      close();
      return;
    }
    if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
      e.preventDefault();
      const f = e.target.dataset.f;
      e.target.blur(); // change を先に確定
      if (E.mode === 'cell' && f === 's') {
        const el = E.el.querySelector('[data-f="e"]');
        if (el && !el.value) { el.focus(); return; }
      }
      close();
      return;
    }
    if (e.key === 'Enter' && e.target.tagName === 'TEXTAREA' && (e.ctrlKey || e.metaKey)) {
      e.preventDefault();
      e.target.blur();
      close();
      return;
    }
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z' && e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
      e.preventDefault();
      e.shiftKey ? KH.app.redo() : KH.app.undo();
      return;
    }
    e.stopPropagation();
  }

  // ───────── 日の編集（行事・休園日） ─────────
  function openDay(d, anchor) {
    const el = openCommon(anchor);
    E.mode = 'day';
    E.day = d;
    renderDay();
    place(el, anchor);
    const ta = el.querySelector('[data-f="ev"]');
    if (ta) { ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); }
  }

  function naturalType(m, d) {
    const dow = new Date(m.y, m.m - 1, d).getDay();
    return KH.holidayName(m.y, m.m, d) || dow === 0 ? 'closed' : dow === 6 ? 'sat' : 'weekday';
  }

  function renderDay() {
    const m = mo();
    const d = E.day;
    const di = M.dayInfos(m)[d - 1];
    const natural = naturalType(m, d);
    const ov = m.dayTypes[d];
    const ev = m.events[d] || '';
    let h = '<div class="pop-head"><div><div class="ttl">' + m.m + '月' + d + '日（' + di.wd + '）</div><div class="sub">' + (di.hol ? esc(di.hol) : '') + '</div></div><button class="btn small ghost x" data-act="close">✕</button></div>';
    h += '<div class="pop-sec"><div class="lbl">行事 <span class="hint">2つ以上あるときは改行（表では縦に並びます）</span></div><textarea class="txt" data-f="ev" rows="3" style="width:100%;height:auto;padding:6px 9px;resize:vertical" placeholder="例：スイミング">' + esc(ev.replace(/／/g, '\n')) + '</textarea>';
    const sugg = ['スイミング', '誕生会', '避難訓練', '運動会', '参観日', '遠足'];
    h += '<div class="quick"><span class="ql">よく使う</span>' + sugg.map((x) => '<button class="q" data-ev="' + x + '">' + x + '</button>').join('') + '</div></div>';
    h += '<div class="pop-sec"><div class="lbl">この日の種類 <span class="hint">黄色の列（土・日・祝）の切りかえ</span></div><div class="tags">' +
      [['weekday', '平日'], ['sat', '土曜（黄色・勤務あり）'], ['closed', '休園日（黄色）']].map(([v, l]) => '<button class="tagb' + (di.type === v ? ' on' : '') + '" data-dt="' + v + '">' + l + '</button>').join('') + '</div>' +
      (ov ? '<div class="note-s">カレンダーでは「' + { weekday: '平日', sat: '土曜', closed: '休園日' }[natural] + '」の日です。 <button class="btn small" data-dt="">カレンダーどおりに戻す</button></div>' : '') + '</div>';
    h += '<div class="pop-foot"><span></span><button class="btn primary" data-act="close">OK</button></div>';
    E.el.innerHTML = h;
  }

  function dayChange(e) {
    if (e.target.dataset.f !== 'ev') return;
    const v = e.target.value.replace(/\r/g, '').split('\n').map((s) => s.trim()).filter(Boolean).join('／');
    ST.commit('行事', (m) => {
      if (v) m.events[E.day] = v;
      else delete m.events[E.day];
    });
  }

  function dayClick(b) {
    const d = b.dataset;
    if (d.act === 'close') return close();
    if (d.ev) {
      const ta = E.el.querySelector('[data-f="ev"]');
      ta.value = (ta.value.trim() ? ta.value.trim() + '\n' : '') + d.ev;
      dayChange({ target: ta });
      ta.focus();
      return;
    }
    if (d.dt !== undefined) {
      const m = mo();
      const natural = naturalType(m, E.day);
      ST.commit('日の種類', (mm) => {
        if (!d.dt || d.dt === natural) delete mm.dayTypes[E.day];
        else mm.dayTypes[E.day] = d.dt;
      });
      renderDay();
    }
  }

  KH.editor = {
    open, openDay, startTimeOnly, close, isOpen,
    refresh: () => { if (isOpen()) (E.mode === 'day' ? renderDay() : refresh()); },
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 設定の画面：職員・勤務記号と色・この月の設定・新しい月・使い方
(function (g) {
  const KH = (g.KH = g.KH || {});
  const U = KH.util;
  const M = KH.model;
  const ST = KH.store;
  const esc = U.esc;
  const mo = () => ST.S.mo;

  let bg = null;

  function modal(html, opt) {
    close();
    bg = document.createElement('div');
    bg.className = 'modal-bg';
    bg.innerHTML = '<div class="dlg' + (opt && opt.narrow ? ' narrow' : '') + (opt && opt.wide ? ' wide' : '') + '" role="dialog" aria-modal="true">' + html + '</div>';
    document.body.appendChild(bg);
    // 背景を押して離したときだけ閉じる（入力欄からのドラッグで閉じないように）
    let downOnBg = false;
    bg.addEventListener('mousedown', (e) => { downOnBg = e.target === bg; });
    bg.addEventListener('click', (e) => {
      if (e.target === bg && downOnBg && !(opt && opt.sticky)) close();
      downOnBg = false;
    });
    bg.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') { e.preventDefault(); close(); }
      e.stopPropagation();
    });
    const dlg = bg.querySelector('.dlg');
    const x = dlg.querySelector('[data-close]');
    if (x) x.addEventListener('click', () => close());
    return dlg;
  }
  function close() {
    if (bg) { bg.remove(); bg = null; KH.grid.focus(); }
  }
  function isOpen() { return !!bg; }

  function head(title) {
    return '<div class="dlg-head"><h2>' + esc(title) + '</h2><button class="btn small ghost x" data-close title="閉じる（Esc）">✕</button></div>';
  }

  function colorSel(name, cur, includeNone) {
    let h = '<div class="colorsel" data-colorsel="' + esc(name) + '">';
    for (const c of KH.COLORS) {
      if (!c.id && !includeNone) continue;
      h += '<button type="button" class="' + (c.id ? 'col-' + c.id : 'none') + (c.id === (cur || '') ? ' on' : '') + '" data-color="' + c.id + '" title="' + c.name + '"></button>';
    }
    return h + '</div>';
  }
  function bindColorSel(root) {
    root.addEventListener('click', (e) => {
      const b = e.target.closest('[data-color]');
      if (!b) return;
      const box = b.closest('.colorsel');
      for (const x of box.querySelectorAll('button')) x.classList.toggle('on', x === b);
      box.dataset.value = b.dataset.color;
    });
  }
  const colorVal = (box) => (box.dataset.value != null ? box.dataset.value : (box.querySelector('.on') || {}).dataset ? box.querySelector('.on').dataset.color : '');

  // ───────── 職員 ─────────
  function staff(focusId) {
    const m = mo();
    const work = U.clone(m.staff);
    const codes = m.codes;
    let dragFrom = -1;
    const dlg = modal(head('職員（' + m.y + '年' + m.m + '月）') + '<div class="dlg-body"><p class="muted">名前・区分・いつもの勤務を決めます。並び順は表の並び順です（≡ をドラッグ、または ↑↓）。<br>「いつもの勤務」を決めておくと、「まとめて ▾ → いつもの勤務で埋める」や新しい月の下書きで自動で入ります。</p><table class="form"><thead><tr><th></th><th>名前</th><th>区分</th><th title="実績と規定時間をくらべて「超過」を出す">規定と比べる</th><th>いつもの勤務</th><th title="有給休暇1日を何時間として数えるか">有給1日</th><th></th></tr></thead><tbody id="stRows"></tbody></table><p style="margin-top:10px"><button class="btn" id="stAdd">＋ 職員を追加</button></p></div><div class="dlg-foot"><span class="left">変更はこの月（と、ここから作る新しい月）に入ります。</span><button class="btn" data-close>やめる</button><button class="btn primary" id="stOk">OK</button></div>');
    const tb = dlg.querySelector('#stRows');

    function defOptions(st) {
      let h = '<option value="">（決めない）</option>';
      for (const c of codes) if (c.kind === 'work') h += '<option value="' + esc(c.id) + '"' + (st.def === c.id ? ' selected' : '') + '>' + esc(c.label + ' ' + (c.name || '') + ' ' + c.start + '〜' + c.end) + '</option>';
      h += '<option value="@time"' + (!st.def && (st.defS || st.defE) ? ' selected' : '') + '>時間で決める…</option>';
      return h;
    }
    function draw() {
      tb.innerHTML = work
        .map((st, i) => {
          const tm = !st.def && (st.defS || st.defE);
          return '<tr data-i="' + i + '" draggable="true"><td style="cursor:grab;color:#999" title="ドラッグで並べかえ">≡</td>' +
            '<td class="w-name"><input class="txt" data-k="name" value="' + esc(st.name) + '" placeholder="名前"></td>' +
            '<td><select data-k="kind"><option value="full"' + (st.kind === 'full' ? ' selected' : '') + '>正職員</option><option value="part"' + (st.kind !== 'full' ? ' selected' : '') + '>パート</option></select></td>' +
            '<td style="text-align:center"><input type="checkbox" data-k="compare"' + (st.compare ? ' checked' : '') + '></td>' +
            '<td><select data-k="def">' + defOptions(st) + '</select>' + (tm ? ' <input class="tin" style="width:64px;height:30px;font-size:13px" data-k="defS" value="' + esc(st.defS || '') + '" placeholder="始"> 〜 <input class="tin" style="width:64px;height:30px;font-size:13px" data-k="defE" value="' + esc(st.defE || '') + '" placeholder="終">' : '') + '</td>' +
            '<td style="white-space:nowrap"><input class="num" style="width:56px" type="number" step="0.5" data-k="paidHours" value="' + esc(st.paidHours != null ? st.paidHours : 8) + '"> h</td>' +
            '<td style="white-space:nowrap"><button class="btn small ghost" data-up title="上へ">↑</button><button class="btn small ghost" data-down title="下へ">↓</button><button class="btn small ghost danger" data-del title="削除">削除</button></td></tr>';
        })
        .join('');
    }
    draw();
    tb.addEventListener('input', (e) => sync(e.target));
    tb.addEventListener('change', (e) => { sync(e.target); if (e.target.dataset.k === 'def' || e.target.dataset.k === 'kind') draw(); });
    function sync(el) {
      const tr = el.closest('tr');
      if (!tr) return;
      const st = work[+tr.dataset.i];
      const k = el.dataset.k;
      if (!k) return;
      if (k === 'compare') st.compare = el.checked;
      else if (k === 'kind') { st.kind = el.value; st.compare = el.value === 'full'; }
      else if (k === 'def') {
        if (el.value === '@time') { st.def = ''; if (!st.defS) st.defS = '14:30'; if (!st.defE) st.defE = '18:30'; }
        else { st.def = el.value; delete st.defS; delete st.defE; }
      } else if (k === 'paidHours') st.paidHours = el.value === '' ? 8 : +el.value;
      else if (k === 'defS' || k === 'defE') st[k] = U.normTime(el.value) || '';
      else st[k] = el.value;
    }
    tb.addEventListener('click', (e) => {
      const tr = e.target.closest('tr');
      if (!tr) return;
      const i = +tr.dataset.i;
      if (e.target.closest('button[data-up]') && i > 0) { [work[i - 1], work[i]] = [work[i], work[i - 1]]; draw(); }
      if (e.target.closest('button[data-down]') && i < work.length - 1) { [work[i + 1], work[i]] = [work[i], work[i + 1]]; draw(); }
      if (e.target.closest('button[data-del]')) {
        const st = work[i];
        const used = Object.keys((m.cells[st.id] || {})).length;
        if (!confirm(st.name + ' さんを削除しますか？' + (used ? '\nこの月に入っている ' + used + '日分の勤務も消えます。（元に戻す で戻せます）' : ''))) return;
        work.splice(i, 1);
        draw();
      }
    });
    tb.addEventListener('dragstart', (e) => { const tr = e.target.closest('tr'); dragFrom = tr ? +tr.dataset.i : -1; e.dataTransfer.effectAllowed = 'move'; });
    tb.addEventListener('dragover', (e) => { e.preventDefault(); for (const x of tb.querySelectorAll('.drag-over')) x.classList.remove('drag-over'); const tr = e.target.closest('tr'); if (tr) tr.classList.add('drag-over'); });
    tb.addEventListener('drop', (e) => {
      e.preventDefault();
      const tr = e.target.closest('tr');
      if (!tr || dragFrom < 0) return;
      const to = +tr.dataset.i;
      const [x] = work.splice(dragFrom, 1);
      work.splice(to, 0, x);
      dragFrom = -1;
      draw();
    });
    dlg.querySelector('#stAdd').onclick = () => {
      work.push({ id: U.uid('s'), name: '', kind: 'part', compare: false, def: '', paidHours: 8 });
      draw();
      const ins = tb.querySelectorAll('input[data-k="name"]');
      ins[ins.length - 1].focus();
    };
    dlg.querySelector('#stOk').onclick = () => {
      for (const st of work) st.name = (st.name || '').trim() || '（名前なし）';
      ST.commit('職員の設定', (mm) => {
        const keep = new Set(work.map((s) => s.id));
        for (const id of Object.keys(mm.cells)) if (!keep.has(id)) delete mm.cells[id];
        mm.staff = work;
        for (const st of work) if (!mm.cells[st.id]) mm.cells[st.id] = {};
      });
      close();
    };
    if (focusId) {
      const i = work.findIndex((s) => s.id === focusId);
      const el = tb.querySelectorAll('input[data-k="name"]')[i];
      if (el) { el.focus(); el.select(); el.closest('tr').scrollIntoView({ block: 'center' }); }
    }
  }

  // ───────── 勤務記号と色 ─────────
  function codes() {
    const m = mo();
    const work = U.clone(m.codes);
    const tags = U.clone(m.tags);
    const dlg = modal(head('勤務記号と色（' + m.y + '年' + m.m + '月）') + '<div class="dlg-body">' +
      '<h3>勤務記号</h3><p class="muted">同じ文字（例：R）でも、色を変えれば別の勤務として使えます（R 緑＝早番（以上児））。集計では同じ文字どうしが合算されます。キーは入力に使う文字で、<b>⇧</b> に ✓ をつけると Shift＋文字 になります。「毎日必要」に人数を入れると、平日の配置チェックに使われます。</p>' +
      '<table class="form"><thead><tr><th>記号</th><th>色</th><th>説明</th><th>始まり</th><th>終わり</th><th title="休憩（6時間をこえたら1時間）を引いた時間">時間</th><th>キー</th><th title="Shift＋キー">⇧</th><th title="平日に毎日必要な人数（配置チェック）">毎日必要</th><th>種類</th><th></th></tr></thead><tbody id="cdRows"></tbody></table>' +
      '<p style="margin-top:10px"><button class="btn" id="cdAdd">＋ 記号を追加</button></p>' +
      '<h3>色（理由）</h3><p class="muted">時間を変えたマスの下半分につける色です（原本の「未満児預かり・以上児預かり・バス乗車」）。</p>' +
      '<table class="form"><thead><tr><th>名前</th><th>色</th><th></th></tr></thead><tbody id="tgRows"></tbody></table><p style="margin-top:10px"><button class="btn" id="tgAdd">＋ 色を追加</button></p>' +
      '</div><div class="dlg-foot"><span class="left">変更はこの月（と、ここから作る新しい月）に入ります。</span><button class="btn" data-close>やめる</button><button class="btn primary" id="cdOk">OK</button></div>', { wide: true });
    const tb = dlg.querySelector('#cdRows');
    const tgb = dlg.querySelector('#tgRows');
    function used(id) {
      let n = 0;
      for (const sid in m.cells) for (const d in m.cells[sid]) if (m.cells[sid][d] && m.cells[sid][d].c === id) n++;
      return n;
    }
    function draw() {
      tb.innerHTML = work.map((c, i) => {
        const w = c.kind === 'work';
        return '<tr data-i="' + i + '"><td><input class="txt" style="width:48px;text-align:center;font-weight:700" maxlength="3" data-k="label" value="' + esc(c.label) + '"></td>' +
          '<td>' + colorSel('c' + i, c.color, true) + '</td>' +
          '<td><input class="txt" style="width:170px" data-k="name" value="' + esc(c.name || '') + '"></td>' +
          '<td>' + (w ? '<input class="tin" style="width:64px;height:30px;font-size:13px" data-k="start" value="' + esc(c.start || '') + '">' : '') + '</td>' +
          '<td>' + (w ? '<input class="tin" style="width:64px;height:30px;font-size:13px" data-k="end" value="' + esc(c.end || '') + '">' : '') + '</td>' +
          '<td>' + (w || c.kind === 'paid' ? '<input class="num" style="width:58px" type="number" step="0.25" data-k="hours" value="' + esc(c.hours) + '">' : '') + '</td>' +
          '<td><input class="txt" style="width:40px;text-align:center" maxlength="1" data-k="key" value="' + esc(c.key || '') + '"></td>' +
          '<td style="text-align:center"><input type="checkbox" data-k="shift"' + (c.shift ? ' checked' : '') + '></td>' +
          '<td>' + (w ? '<input class="num" style="width:48px" type="number" min="0" step="1" data-k="need" value="' + esc(c.need || 0) + '">' : '') + '</td>' +
          '<td><select data-k="kind"><option value="work"' + (w ? ' selected' : '') + '>勤務</option><option value="off"' + (c.kind === 'off' ? ' selected' : '') + '>休み</option><option value="paid"' + (c.kind === 'paid' ? ' selected' : '') + '>有給</option></select></td>' +
          '<td style="white-space:nowrap"><button class="btn small ghost" data-up>↑</button><button class="btn small ghost" data-down>↓</button><button class="btn small ghost danger" data-del>削除</button></td></tr>';
      }).join('');
      tgb.innerHTML = tags.map((t, i) => '<tr data-i="' + i + '"><td><input class="txt" style="width:200px" data-k="name" value="' + esc(t.name) + '"></td><td>' + colorSel('t' + i, t.color, false) + '</td><td><button class="btn small ghost danger" data-del>削除</button></td></tr>').join('');
    }
    draw();
    bindColorSel(tb);
    bindColorSel(tgb);
    tb.addEventListener('click', (e) => {
      const b = e.target.closest('[data-color]');
      if (b) { const i = +b.closest('tr').dataset.i; work[i].color = b.dataset.color; return; }
      const tr = e.target.closest('tr');
      if (!tr) return;
      const i = +tr.dataset.i;
      if (e.target.closest('button[data-up]') && i > 0) { [work[i - 1], work[i]] = [work[i], work[i - 1]]; draw(); }
      if (e.target.closest('button[data-down]') && i < work.length - 1) { [work[i + 1], work[i]] = [work[i], work[i + 1]]; draw(); }
      if (e.target.closest('button[data-del]')) {
        const n = used(work[i].id);
        if (n && !confirm('「' + work[i].label + '」はこの月の ' + n + 'マスで使われています。削除すると、そのマスは「?」になります。削除しますか？')) return;
        work.splice(i, 1);
        draw();
      }
    });
    tb.addEventListener('change', (e) => {
      const el = e.target, k = el.dataset.k;
      if (!k) return;
      const tr = el.closest('tr');
      const c = work[+tr.dataset.i];
      if (k === 'shift') c.shift = el.checked;
      else if (k === 'hours' || k === 'need') c[k] = el.value === '' ? 0 : +el.value;
      else if (k === 'start' || k === 'end') {
        c[k] = U.normTime(el.value) || el.value;
        el.value = c[k];
        const h = M.codeHoursFromTimes(c.start, c.end, m.breakRule);
        if (h != null) { c.hours = h; const hi = tr.querySelector('[data-k="hours"]'); if (hi) hi.value = h; }
      } else if (k === 'kind') {
        c.kind = el.value;
        if (c.kind === 'work' && !c.start) { c.start = '8:00'; c.end = '16:00'; c.hours = 7; }
        if (c.kind === 'paid' && !c.hours) c.hours = 8;
        draw();
      } else if (k === 'key') c.key = el.value.toUpperCase();
      else c[k] = el.value;
    });
    tgb.addEventListener('click', (e) => {
      const b = e.target.closest('[data-color]');
      if (b) { tags[+b.closest('tr').dataset.i].color = b.dataset.color; return; }
      if (e.target.closest('button[data-del]')) { tags.splice(+e.target.closest('tr').dataset.i, 1); draw(); }
    });
    tgb.addEventListener('change', (e) => { if (e.target.dataset.k === 'name') tags[+e.target.closest('tr').dataset.i].name = e.target.value; });
    dlg.querySelector('#cdAdd').onclick = () => {
      work.push({ id: U.uid('c'), label: '', color: '', name: '', start: '8:00', end: '17:00', hours: 8, kind: 'work', key: '', shift: false, need: 0 });
      draw();
      const ins = tb.querySelectorAll('input[data-k="label"]');
      ins[ins.length - 1].focus();
    };
    dlg.querySelector('#tgAdd').onclick = () => { tags.push({ id: U.uid('t'), name: '', color: 'purple' }); draw(); };
    dlg.querySelector('#cdOk').onclick = () => {
      const bad = work.find((c) => !String(c.label || '').trim());
      if (bad) return alert('記号の文字が空の行があります');
      for (const c of work) {
        c.label = String(c.label).trim();
        if (c.kind === 'work' && (U.parseTime(c.start) == null || U.parseTime(c.end) == null)) return alert('「' + c.label + '」の時間が読めません（例：7:15）');
      }
      const keys = {};
      for (const c of work) {
        if (!c.key) continue;
        const k = c.key + (c.shift ? '⇧' : '');
        if (keys[k]) return alert('キー「' + (c.shift ? 'Shift+' : '') + c.key + '」が「' + keys[k] + '」と「' + c.label + '」で重なっています');
        keys[k] = c.label;
      }
      ST.commit('勤務記号の設定', (mm) => {
        mm.codes = work;
        mm.tags = tags.filter((t) => t.name.trim());
      });
      close();
    };
  }

  // ───────── この月の設定 ─────────
  function monthSettings() {
    const m = mo();
    const dlg = modal(head(m.y + '年' + m.m + '月の設定') + '<div class="dlg-body">' +
      '<div class="frow"><label>表の題</label><input class="txt" id="msTitle" value="' + esc(m.title) + '" style="width:220px"> <span class="muted">印刷の見出し（例：勤務割表）</span></div>' +
      '<div class="frow"><label>規定時間</label><input class="num" id="msKitei" type="number" step="0.5" value="' + esc(m.kitei) + '"> 時間 <span class="muted">正職員の「超過 ＝ 実績 − 規定」に使います</span></div>' +
      '<div class="frow"><label>休憩のきまり</label><input class="num" id="msOver" type="number" step="0.5" value="' + esc(m.breakRule.over) + '" style="width:60px"> 時間をこえたら <input class="num" id="msMin" type="number" step="5" value="' + esc(m.breakRule.minutes) + '" style="width:60px"> 分 <span class="muted">時間を変えたときの自動計算に使います</span></div>' +
      '<div class="frow"><label>押印欄</label><input class="txt" id="msStamps" value="' + esc(m.stamps.join('、')) + '" style="width:220px"> <span class="muted">「、」区切り（例：園長、主任）。空なら印刷しません</span></div>' +
      '</div><div class="dlg-foot"><button class="btn" data-close>やめる</button><button class="btn primary" id="msOk">OK</button></div>', { narrow: false });
    dlg.querySelector('#msOk').onclick = () => {
      const k = parseFloat(dlg.querySelector('#msKitei').value);
      const over = parseFloat(dlg.querySelector('#msOver').value);
      const min = parseFloat(dlg.querySelector('#msMin').value);
      ST.commit('この月の設定', (mm) => {
        mm.title = dlg.querySelector('#msTitle').value.trim() || '勤務割表';
        mm.kitei = isNaN(k) ? 0 : k;
        mm.breakRule = { over: isNaN(over) ? 6 : over, minutes: isNaN(min) ? 60 : min };
        mm.stamps = dlg.querySelector('#msStamps').value.split(/[、,，\s]+/).map((s) => s.trim()).filter(Boolean);
      });
      close();
    };
  }

  // ───────── 新しい月 ─────────
  function newMonth(y, m0) {
    const keys = ST.monthKeys();
    const last = U.parseMonthKey(keys[keys.length - 1]);
    const nx = y ? { y, m: m0 } : U.addMonth(last.y, last.m, 1);
    const srcKey = ST.S.data.cur;
    const opts = keys.map((k) => { const p = U.parseMonthKey(k); return '<option value="' + k + '"' + (k === srcKey ? ' selected' : '') + '>' + p.y + '年' + p.m + '月（' + U.wareki(p.y) + '）</option>'; }).join('');
    const dlg = modal(head('新しい月をつくる') + '<div class="dlg-body">' +
      '<div class="frow"><label>つくる月</label><input class="num" id="nmY" type="number" value="' + nx.y + '" style="width:80px"> 年 <input class="num" id="nmM" type="number" min="1" max="12" value="' + nx.m + '" style="width:60px"> 月 <span class="muted" id="nmW"></span></div>' +
      '<div class="frow"><label>引きつぐ月</label><select id="nmSrc" style="height:32px;border:1px solid var(--line2);border-radius:7px">' + opts + '</select> <span class="muted">職員・勤務記号・色・規定時間を引きつぎます</span></div>' +
      '<div class="frow"><label>規定時間</label><input class="num" id="nmK" type="number" step="0.5" value="' + esc(mo().kitei) + '"> 時間 <span class="muted">月ごとに変わるときは入れ直してください</span></div>' +
      '<h3>下書き</h3>' +
      '<label class="check"><input type="checkbox" id="nmSat" checked><span>土曜日は全員「休」にしておく<br><span class="muted">出る人だけあとで変えます</span></span></label>' +
      '<label class="check"><input type="checkbox" id="nmDef" checked><span>平日を「いつもの勤務」で埋めておく<br><span class="muted">職員の設定で「いつもの勤務」を決めている人（パートさんなど）だけ。正職員のローテーションは空けておきます</span></span></label>' +
      '<label class="check"><input type="checkbox" id="nmRot" checked><span>つくったあと、正職員のローテーションの下書きへ進む<br><span class="muted">前の月の並びの続きで、R緑→E→C… のように1日ずつ回します（確認画面が出ます）</span></span></label>' +
      '<p class="muted">日曜・祝日は自動で黄色の列になり、祝日の名前は行事に入ります。</p>' +
      '</div><div class="dlg-foot"><button class="btn" data-close>やめる</button><button class="btn primary" id="nmOk">つくる</button></div>', { narrow: true });
    const w = () => { const yy = +dlg.querySelector('#nmY').value; dlg.querySelector('#nmW').textContent = yy ? '（' + U.wareki(yy) + '年）' : ''; };
    dlg.querySelector('#nmY').addEventListener('input', w);
    w();
    dlg.querySelector('#nmSrc').addEventListener('change', (e) => {
      const src = ST.S.data.months[e.target.value];
      if (src) dlg.querySelector('#nmK').value = src.kitei;
    });
    dlg.querySelector('#nmOk').onclick = () => {
      const yy = +dlg.querySelector('#nmY').value, mm = +dlg.querySelector('#nmM').value;
      if (!(yy >= 2000 && yy <= 2100 && mm >= 1 && mm <= 12)) return alert('年と月を確かめてください');
      const key = U.monthKey(yy, mm);
      if (ST.S.data.months[key] && !confirm(yy + '年' + mm + '月 はもうあります。作り直しますか？（今の内容は消えます。元に戻す で戻せます）')) return;
      const src = ST.S.data.months[dlg.querySelector('#nmSrc').value];
      const k = parseFloat(dlg.querySelector('#nmK').value);
      const nm = M.newMonth(src, yy, mm, { satOff: dlg.querySelector('#nmSat').checked, fillDef: dlg.querySelector('#nmDef').checked, kitei: isNaN(k) ? src.kitei : k });
      ST.commitMonths(yy + '年' + mm + '月をつくる', (data) => {
        data.months[key] = nm;
        data.cur = key;
      });
      close();
      const hasFull = nm.staff.some((s) => s.kind === 'full' && !s.def && !s.defS);
      if (hasFull && dlg.querySelector('#nmRot') && dlg.querySelector('#nmRot').checked) rotation();
      else KH.app.toast(yy + '年' + mm + '月をつくりました。正職員の欄を入れていきましょう');
    };
  }

  function deleteMonth() {
    const m = mo();
    const keys = ST.monthKeys();
    if (keys.length <= 1) return alert('月が1つしかないので削除できません');
    if (!confirm(m.y + '年' + m.m + '月 を削除しますか？（元に戻す で戻せます）')) return;
    const key = U.monthKey(m.y, m.m);
    ST.commitMonths(m.y + '年' + m.m + '月を削除', (data) => {
      delete data.months[key];
      const ks = Object.keys(data.months).sort();
      data.cur = ks.filter((k) => k < key).pop() || ks[0];
    });
  }

  // ───────── 正職員のローテーションを下書き ─────────
  function rotation() {
    const m = mo();
    const prevKey = (() => { const p = U.addMonth(m.y, m.m, -1); return U.monthKey(p.y, p.m); })();
    const prev = ST.S.data.months[prevKey] || null;
    const cands = m.staff.filter((s) => s.kind === 'full' && !s.def && !s.defS);
    let ids = cands.map((s) => s.id);
    let cycle = M.detectCycle(prev || m, ids);
    if (cycle.length < 2) cycle = m.codes.filter((c) => c.kind === 'work' && +c.need > 0).map((c) => c.id);
    const cm = M.codeMap(m);
    const chip = (id, i) => { const c = cm.get(id); return c ? '<span style="display:inline-flex;align-items:center;gap:4px;margin:3px 2px;padding:2px 6px 2px 3px;border:1px solid var(--line);border-radius:8px;background:#fff">' + (i > 0 ? '<button class="btn small ghost" data-mv="' + i + '" title="ひとつ前と入れかえる" style="padding:0 3px;height:20px;font-size:10px">◀</button>' : '') + '<span class="sw' + (c.color ? ' col-' + c.color : '') + '">' + esc(c.label) + '</span><small>' + esc(c.name || c.start + '〜') + '</small></span>' : ''; };
    const empties = () => {
      let n = 0;
      for (const di of M.dayInfos(m)) if (di.type === 'weekday') for (const sid of ids) if (!(m.cells[sid] && m.cells[sid][di.d])) n++;
      return n;
    };
    const dlg = modal(head('正職員のローテーションを下書きする') + '<div class="dlg-body">' +
      '<p>' + (prev ? prev.m + '月の並びの続きから' : 'この順番で') + '、下の順番で役割を1日ずつ回して、<b>空いている平日だけ</b>を埋めます（入っているマス・土曜・休園日はそのまま）。できたら、休みの希望や行事に合わせて直してください。</p>' +
      '<h3>回す順番' + (prev ? '<span class="muted" style="font-weight:500;font-size:12px">（' + prev.m + '月から見つけました。◀ で順番を入れかえ）</span>' : '') + '</h3><div id="rtCycle"></div>' +
      '<h3>対象の職員</h3><div id="rtStaff">' + cands.map((s) => '<label class="check" style="display:inline-flex;margin:4px 14px 4px 0"><input type="checkbox" data-sid="' + esc(s.id) + '" checked><span>' + esc(s.name) + '</span></label>').join('') + (cands.length ? '' : '<p class="muted">正職員（いつもの勤務を決めていない人）がいません。「設定 ▾ → 職員」で区分を「正職員」にしてください。</p>') + '</div>' +
      '<p class="muted" id="rtInfo"></p>' +
      '</div><div class="dlg-foot"><span class="left">あとで「元に戻す」で取り消せます</span><button class="btn" data-close>やめる</button><button class="btn primary" id="rtGo">下書きする</button></div>');
    const drawCycle = () => {
      dlg.querySelector('#rtCycle').innerHTML = cycle.length ? cycle.map((id, i) => chip(id, i) + (i < cycle.length - 1 ? '<span class="muted"> → </span>' : '<span class="muted"> →（はじめに戻る）</span>')).join('') : '<p class="muted">順番が見つかりませんでした。「設定 ▾ → 勤務記号」で「毎日必要」を入れると、その記号で回します。</p>';
      dlg.querySelector('#rtInfo').textContent = '埋めるマス：' + empties() + '（' + ids.length + '人）';
    };
    drawCycle();
    dlg.querySelector('#rtCycle').addEventListener('click', (e) => {
      const b = e.target.closest('[data-mv]');
      if (!b) return;
      const i = +b.dataset.mv;
      if (i > 0) { [cycle[i - 1], cycle[i]] = [cycle[i], cycle[i - 1]]; drawCycle(); }
    });
    dlg.querySelector('#rtStaff').addEventListener('change', () => {
      ids = [...dlg.querySelectorAll('#rtStaff input:checked')].map((x) => x.dataset.sid);
      drawCycle();
    });
    dlg.querySelector('#rtGo').onclick = () => {
      if (!cycle.length || !ids.length) return alert('回す順番と対象の職員を確かめてください');
      let n = 0;
      ST.commit('ローテーションの下書き', (mm) => { n = M.draftRotation(mm, prev, ids, cycle); });
      close();
      KH.app.toast(n ? n + 'マスを下書きしました。配置チェックの行も見てください' : '埋める所はありませんでした（平日がもう入っています）');
    };
  }

  // ───────── 使い方 ─────────
  function help() {
    const k = (s) => '<kbd>' + s + '</kbd>';
    const dlg = modal(head('使い方') + '<div class="dlg-body">' +
      '<p class="help-demo"><button class="btn primary" id="helpDemo">▶ 使い方のデモを見る</button><span class="muted"> 練習用の架空のデータで、画面が自動で動いて見せます（あなたのデータは変わりません）</span></p>' +
      '<h3>入れ方（3つのやり方）</h3><ol class="steps">' +
      '<li><b>1マスずつ：</b>マスをクリック → 下の記号ボタン（またはキーボードの文字）。入れると自動で次の日へ進むので、R・B・E… と続けて打てます。</li>' +
      '<li><b>まとめて：</b>ドラッグで範囲を選ぶ（名前をクリックでその人の1か月、日付をクリックでその日の全員）→ 記号ボタン。</li>' +
      '<li><b>写す：</b>先週の並びを選んで ' + k('Ctrl') + '+' + k('C') + '（Macは ⌘C）→ 貼りたい所を選んで ' + k('Ctrl') + '+' + k('V') + '。</li></ol>' +
      '<h3>時間の変更（残業・早退・バス乗車など）</h3><p>マスを選んで ' + k('Enter') + '（ダブルクリック・右クリックでも）。終わりの時刻を入れると、過不足（+0.5 など）を自動で計算します。色（未満児預かり・以上児預かり・バス乗車）やメモ（未満児 など）もここで。<br>「9:00〜11:00」のような<b>時間だけの勤務</b>は、下の「⏱ 時間だけ」ボタン（キー ' + k('@') + '）。</p>' +
      '<h3>キーボード</h3><div class="help-grid">' +
      '<div><span>' + k('R') + ' ' + k('B') + ' ' + k('E') + ' ' + k('I') + ' …</span><span>記号を入れる</span></div>' +
      '<div><span>' + k('Shift') + '+' + k('R') + '、' + k('Shift') + '+' + k('I') + '</span><span>色つき（R緑・I青）</span></div>' +
      '<div><span>' + k('Y') + ' ／ ' + k('U') + '</span><span>休 ／ 有</span></div>' +
      '<div><span>' + k('@') + '</span><span>時間だけの勤務</span></div>' +
      '<div><span>' + k('Delete') + '</span><span>空にする</span></div>' +
      '<div><span>' + k('Enter') + '</span><span>時間・色・メモを変える</span></div>' +
      '<div><span>矢印 ／ ' + k('Shift') + '+矢印</span><span>動く ／ 範囲を広げる</span></div>' +
      '<div><span>' + k('Ctrl') + '+' + k('Z') + ' ／ ' + k('Ctrl') + '+' + k('Y') + '</span><span>元に戻す ／ やり直し</span></div>' +
      '<div><span>' + k('Ctrl') + '+' + k('C') + ' ／ ' + k('V') + '</span><span>コピー ／ 貼り付け</span></div>' +
      '<div><span>' + k('Ctrl') + '+' + k('P') + '</span><span>印刷</span></div></div>' +
      '<h3>見る人のために</h3><p>右上の「✎ 編集中」を押すと「👁 見るだけ」になり、うっかり書きかえません。名前をクリックでその人の1か月（カレンダー）、日付をクリックでその日の配置（何時に何人いるか）が見られます。「個人」の画面からは、スマホ用のページやカレンダー（.ics）を書き出せます。</p>' +
      '<h3>保存</h3><p>入れた内容はこのブラウザに<b>自動で保存</b>されます。別のパソコンで使うときや控えを残すときは「ファイル ▾ → ファイルに保存」。</p>' +
      '<h3>集計（原本と同じ計算）</h3><p>計＝勤務記号の数＋有／時間数＝記号の時間の合計（有は1日分）／過不足＝時間の変更や時間だけの勤務の合計／実績＝時間数＋過不足／超過＝実績−規定（「規定と比べる」人だけ）。</p>' +
      '</div><div class="dlg-foot"><button class="btn primary" data-close>閉じる</button></div>');
    dlg.querySelector('#helpDemo').onclick = () => { close(); KH.tour.start(); };
  }

  // ───────── 確認つきの読み込み ─────────
  function importFile() {
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        try {
          const res = ST.importJSON(String(rd.result));
          const names = res.keys.sort().map((k) => { const p = U.parseMonthKey(k); return p.y + '年' + p.m + '月'; });
          const clash = res.keys.filter((k) => ST.S.data.months[k]);
          if (!confirm('「' + f.name + '」から ' + names.join('・') + ' を読み込みます。' + (clash.length ? '\n同じ月（' + clash.length + '）は、ファイルの内容に置きかわります。' : '') + '\nよろしいですか？（元に戻す で戻せます）')) return;
          res.apply();
          KH.app.toast('読み込みました：' + names.join('・'));
        } catch (err) {
          alert(err.message);
        }
      };
      rd.readAsText(f);
    };
    inp.click();
  }

  KH.dialogs = { staff, codes, monthSettings, newMonth, deleteMonth, rotation, help, importFile, close, isOpen, modal, head };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 見る人のための表示：個人（1か月のカレンダー）と 日ごと（その日の配置・人数）。カレンダー書き出しも
(function (g) {
  const KH = (g.KH = g.KH || {});
  const U = KH.util;
  const M = KH.model;
  const ST = KH.store;
  const esc = U.esc;
  const mo = () => ST.S.mo;

  function todayIn(m) {
    const n = new Date();
    return n.getFullYear() === m.y && n.getMonth() + 1 === m.m ? n.getDate() : 0;
  }
  function dnClass(di) {
    return di.hol ? 'hol' : di.dow === 0 ? 'sun' : di.dow === 6 ? 'sat' : '';
  }

  // 1日ぶんの中身（個人の表示・スマホ用ページ・印刷で共通）
  function dayParts(m, cm, st, di) {
    const cell = m.cells[st.id] && m.cells[st.id][di.d];
    const inf = M.cellInfo(m, cell, cm, st);
    const tag = cell && cell.tag ? m.tags.find((t) => t.id === cell.tag) : null;
    const p = { kind: inf.kind, inf, cell, tag, note: (cell && cell.n) || '', ev: m.events[di.d] || '' };
    if (inf.kind === 'work') {
      p.label = inf.code.label;
      p.color = inf.code.color;
      p.name = inf.code.name || '';
      p.s = U.fmtTime(inf.s);
      p.e = U.fmtTime(inf.e);
      p.sCh = inf.s !== inf.ss;
      p.eCh = inf.e !== inf.se;
    } else if (inf.kind === 'time') {
      p.label = '⏱';
      p.name = '時間の勤務';
      p.s = inf.s != null ? U.fmtTime(inf.s) : '';
      p.e = inf.e != null ? U.fmtTime(inf.e) : '';
    } else if (inf.kind === 'off' || inf.kind === 'paid') {
      p.label = inf.code.label;
      p.color = inf.code.color;
      p.name = inf.code.name || '';
    } else if (inf.kind === 'unknown') p.label = inf.label + '?';
    p.adj = inf.adj || 0;
    return p;
  }

  function dayBox(m, cm, st, di, today) {
    const p = dayParts(m, cm, st, di);
    let h = '<div class="day' + (di.yellow ? ' yl' : '') + (di.d === today ? ' today' : '') + '">';
    h += '<div class="dn ' + dnClass(di) + '">' + di.d + '<small>（' + di.wd + '）' + (di.hol ? esc(di.hol) : '') + '</small></div>';
    if (p.kind === 'work' || p.kind === 'time') {
      h += '<div class="code"><span class="sw' + (p.color ? ' col-' + p.color : '') + '">' + esc(p.label) + '</span><span class="nm">' + esc(p.name) + '</span></div>';
      h += '<div class="tm"><span class="' + (p.sCh ? 'ch' : '') + '">' + esc(p.s) + '</span>〜<span class="' + (p.eCh ? 'ch' : '') + '">' + esc(p.e) + '</span></div>';
    } else if (p.kind === 'off' || p.kind === 'paid') {
      h += '<div class="off">' + esc(p.label) + '<small style="font-size:11px;font-weight:600;margin-left:4px">' + esc(p.name) + '</small></div>';
    } else if (p.kind === 'unknown') h += '<div class="off">' + esc(p.label) + '</div>';
    if (p.kind === 'time') { if (p.adj) h += '<div class="nt">（' + U.fmtH(p.adj) + '時間）</div>'; }
    else if (p.adj) h += '<div class="ex">' + (p.adj > 0 ? '＋' : '−') + U.fmtH(Math.abs(p.adj)) + '時間</div>';
    if (p.tag) h += '<span class="tg col-' + esc(p.tag.color) + '">' + esc(p.tag.name) + '</span>';
    if (p.note) h += '<div class="nt">' + esc(p.note) + '</div>';
    if (p.ev) h += '<div class="evt">📌 ' + esc(p.ev.replace(/／/g, '・')) + '</div>';
    return h + '</div>';
  }

  // ───────── 個人 ─────────
  function renderPerson(main) {
    const m = mo();
    const cm = M.codeMap(m);
    const days = M.dayInfos(m);
    if (!m.staff.length) { main.innerHTML = '<div class="pv"><p>職員がいません。「設定 ▾ → 職員」から追加してください。</p></div>'; return; }
    let sid = ST.pref('person');
    if (!m.staff.find((s) => s.id === sid)) sid = m.staff[0].id;
    const idx = m.staff.findIndex((s) => s.id === sid);
    const st = m.staff[idx];
    const s = M.staffSummary(m, st, cm);
    const today = todayIn(m);
    let h = '<div class="pv"><div class="pv-head">';
    h += '<button class="btn ib" data-pv="prev" title="前の人">◀</button><select id="pvSel" aria-label="職員">' + m.staff.map((x) => '<option value="' + esc(x.id) + '"' + (x.id === sid ? ' selected' : '') + '>' + esc(x.name) + '</option>').join('') + '</select><button class="btn ib" data-pv="next" title="次の人">▶</button>';
    h += '<span class="muted">' + m.y + '年' + m.m + '月（' + U.wareki(m.y) + '）</span><span class="spacer"></span>';
    h += '<div class="pv-stats"><div class="stat"><div class="k">出勤</div><div class="v">' + s.days + '<small>日</small></div></div><div class="stat"><div class="k">休み</div><div class="v">' + ((s.counts['休'] || 0) + (s.counts['有'] || 0)) + '<small>日</small></div></div><div class="stat"><div class="k">実績時間</div><div class="v">' + U.fmtH(s.actual) + '<small>時間</small></div></div>' + (s.over != null ? '<div class="stat"><div class="k">超過（規定 ' + U.fmtH(m.kitei) + '）</div><div class="v' + (s.over < 0 ? ' neg' : '') + '">' + U.fmtH(s.over, true) + '<small>時間</small></div></div>' : '') + '</div>';
    h += '</div>';
    // カレンダー（日曜はじまり）
    h += '<div class="cal">' + U.WD.map((w, i) => '<div class="wh' + (i === 0 ? ' sun' : i === 6 ? ' sat' : '') + '">' + w + '</div>').join('');
    const lead = days[0].dow;
    for (let i = 0; i < lead; i++) h += '<div class="day blank"></div>';
    for (const di of days) h += dayBox(m, cm, st, di, today);
    const trail = (7 - ((lead + days.length) % 7)) % 7;
    for (let i = 0; i < trail; i++) h += '<div class="day blank"></div>';
    h += '</div>';
    // スマホ幅のときの一覧
    h += '<div class="pv-list">' + days.map((di) => dayBox(m, cm, st, di, today)).join('') + '</div>';
    h += '<div class="pv-foot"><button class="btn primary" data-pv="phone" title="この人の1か月をスマホで見やすいページ（HTMLファイル）にします。LINEやメールで送れます">📱 スマホ用ページを書き出す</button><button class="btn" data-pv="ics" title="Googleカレンダー・iPhoneのカレンダーに取りこめるファイル">📅 カレンダー（.ics）に書き出す</button><button class="btn" data-pv="print">🖨 この人の予定を印刷</button><span class="muted">記号の説明：' + m.codes.filter((c) => c.kind === 'work').map((c) => esc(c.label + (c.color ? '（' + (KH.COLORS.find((x) => x.id === c.color) || {}).name + '）' : '') + '=' + (c.name || '') + ' ' + c.start + '〜' + c.end)).join('　') + '</span></div>';
    h += '</div>';
    main.innerHTML = h;
    main.querySelector('#pvSel').onchange = (e) => { ST.pref('person', e.target.value); renderPerson(main); };
    main.querySelector('.pv').addEventListener('click', (e) => {
      const b = e.target.closest('[data-pv]');
      if (!b) return;
      const a = b.dataset.pv;
      if (a === 'prev' || a === 'next') {
        const j = (idx + (a === 'next' ? 1 : -1) + m.staff.length) % m.staff.length;
        ST.pref('person', m.staff[j].id);
        renderPerson(main);
      }
      if (a === 'ics') icsDialog(st);
      if (a === 'phone') download(st.name + '_' + m.y + '年' + m.m + '月_勤務.html', phonePage(m, st), 'text/html');
      if (a === 'print') KH.print.person(st.id);
    });
  }

  // ───────── 日ごと ─────────
  function renderDayView(main) {
    const m = mo();
    const cm = M.codeMap(m);
    const days = M.dayInfos(m);
    let d = +ST.pref('day') || 0;
    if (!d || d > days.length) d = todayIn(m) || (days.find((x) => x.type === 'weekday') || days[0]).d;
    const di = days[d - 1];
    const rows = [];
    const offs = { off: [], paid: [], blank: [] };
    for (const st of m.staff) {
      const pr = M.presence(m, st, d, cm);
      const p = dayParts(m, cm, st, di);
      if (pr.s != null) rows.push({ st, pr, p });
      else if (p.kind === 'work' || p.kind === 'time') rows.push({ st, pr, p });
      else if (p.kind === 'off') offs.off.push(st.name + (p.label !== '休' ? '（' + p.label + '）' : ''));
      else if (p.kind === 'paid') offs.paid.push(st.name);
      else offs.blank.push(st.name);
    }
    rows.sort((a, b) => (a.pr.s == null ? 9999 : a.pr.s) - (b.pr.s == null ? 9999 : b.pr.s) || (a.pr.e || 0) - (b.pr.e || 0));
    let t0 = 7 * 60, t1 = 19 * 60;
    for (const r of rows) {
      if (r.pr.s != null) t0 = Math.min(t0, Math.floor(r.pr.s / 60) * 60);
      if (r.pr.e != null) t1 = Math.max(t1, Math.ceil(r.pr.e / 60) * 60);
    }
    const span = t1 - t0;
    const pct = (x) => ((x - t0) / span) * 100;
    const ev = m.events[d];
    let h = '<div class="dv"><div class="dv-head"><button class="btn ib" data-dv="prev" title="前の日">◀</button><span class="dt ' + dnClass(di) + '">' + m.m + '月' + d + '日（' + di.wd + '）' + (di.hol ? ' ' + esc(di.hol) : '') + '</span><button class="btn ib" data-dv="next" title="次の日">▶</button>';
    h += '<select id="dvSel" style="height:32px;border:1px solid var(--line2);border-radius:7px">' + days.map((x) => '<option value="' + x.d + '"' + (x.d === d ? ' selected' : '') + '>' + x.d + '日（' + x.wd + '）</option>').join('') + '</select>';
    if (ev) h += '<span class="dv-ev">📌 ' + esc(ev.replace(/／/g, '・')) + '</span>';
    h += '<span class="spacer"></span><span class="pill">出勤 <b>' + rows.length + '</b>人</span>';
    const iss = M.dayCheck(m, di, cm);
    if (iss.length) h += '<span class="pill" style="background:var(--warn-bg);color:var(--warn);border-color:#f0c98a">足りない配置：' + iss.map((x) => esc(x.code.label + (x.code.name ? '（' + x.code.name + '）' : ''))).join('、') + '</span>';
    h += '</div>';
    if (!rows.length) h += '<p class="muted">この日に勤務の人はいません。</p>';
    else {
      const ticks = [];
      for (let t = t0; t <= t1; t += 60) ticks.push(t);
      const grid = '<div class="tl-grid">' + ticks.map((t) => '<i style="left:' + pct(t) + '%"></i>').join('') + '</div>';
      h += '<div class="tl"><div class="tl-axis"><span></span><span></span><span></span><div class="ax">' + ticks.map((t) => '<span style="left:' + pct(t) + '%">' + t / 60 + '時</span>').join('') + '</div></div>';
      for (const r of rows) {
        const p = r.p;
        let bar = '';
        if (r.pr.s != null) {
          const inf = p.inf;
          let ext = '';
          if (inf.kind === 'work') {
            if (inf.e > inf.se) ext += '<span class="ext" style="left:' + ((inf.se - inf.s) / (inf.e - inf.s)) * 100 + '%;right:0"></span>';
            if (inf.s < inf.ss) ext += '<span class="ext" style="left:0;right:' + (100 - ((inf.ss - inf.s) / (inf.e - inf.s)) * 100) + '%;border-radius:4px 0 0 4px"></span>';
          }
          const col = p.tag && p.kind === 'time' ? p.tag.color : p.color;
          bar = '<span class="bar' + (col ? ' col-' + col : '') + '" style="left:' + pct(r.pr.s) + '%;width:' + (pct(r.pr.e) - pct(r.pr.s)) + '%" title="' + esc(p.s + '〜' + p.e) + '">' + ext + '</span>';
        }
        const extra = [p.tag ? p.tag.name : '', p.note].filter(Boolean).join('・');
        h += '<div class="tl-row"><span class="nm" title="' + esc(r.st.name) + '">' + esc(r.st.name) + '</span><span><span class="sw' + (p.color ? ' col-' + p.color : '') + '">' + esc(p.label) + '</span></span><span class="tm"><span class="' + (p.sCh ? 'ch' : '') + '">' + esc(p.s) + '</span>〜<span class="' + (p.eCh ? 'ch' : '') + '">' + esc(p.e) + '</span>' + (extra ? '<br><small class="muted">' + esc(extra) + '</small>' : '') + '</span><div class="tl-bar">' + grid + bar + '</div></div>';
      }
      // 30分ごとの人数
      const slots = [];
      for (let t = t0; t < t1; t += 30) {
        let n = 0;
        const mid = t + 15; // 30分の真ん中の時刻にいる人
        for (const r of rows) if (r.pr.s != null && r.pr.s <= mid && r.pr.e > mid) n++;
        slots.push({ t, n });
      }
      const mx = Math.max(1, ...slots.map((x) => x.n));
      h += '<div class="tl-axis tl-count" title="30分ごとに、園にいる職員の数"><span class="muted" style="font-size:12px;align-self:center">いる人数</span><span></span><span></span><div class="ax">' +
        slots.map((x) => '<span class="cb' + (x.n <= 2 ? ' low' : '') + '" style="left:' + pct(x.t) + '%;width:calc(' + (pct(x.t + 30) - pct(x.t)) + '% - 2px);height:' + (x.n / mx) * 28 + 'px" title="' + U.fmtTime(x.t) + '〜 ' + x.n + '人"></span><span class="cn" style="left:' + pct(x.t + 15) + '%;bottom:' + ((x.n / mx) * 28 + 1) + 'px">' + (x.n || '') + '</span>').join('') + '</div></div>';
      h += '</div>';
    }
    const list = (k, arr) => (arr.length ? '<div class="dv-off"><b style="min-width:60px">' + k + '</b>' + arr.map((n) => '<span class="pill">' + esc(n) + '</span>').join('') + '</div>' : '');
    h += list('休み', offs.off) + list('有給', offs.paid) + list('未入力', offs.blank);
    h += '</div>';
    main.innerHTML = h;
    const go = (nd) => { ST.pref('day', nd); renderDayView(main); };
    main.querySelector('#dvSel').onchange = (e) => go(+e.target.value);
    main.querySelector('.dv').addEventListener('click', (e) => {
      const b = e.target.closest('[data-dv]');
      if (!b) return;
      if (b.dataset.dv === 'prev') go(d > 1 ? d - 1 : days.length);
      if (b.dataset.dv === 'next') go(d < days.length ? d + 1 : 1);
    });
  }

  // ───────── 書き出し ─────────
  function download(name, text, type) {
    const blob = new Blob([type === 'text/csv' ? '\ufeff' + text : text], { type: (type || 'text/plain') + ';charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
  }

  const icsEsc = (s) => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
  function fold(line) {
    const enc = new TextEncoder();
    if (enc.encode(line).length <= 74) return line;
    const out = [];
    let cur = '', n = 0;
    for (const ch of line) {
      const b = enc.encode(ch).length;
      if (n + b > (out.length ? 73 : 74)) { out.push(cur); cur = ''; n = 0; }
      cur += ch;
      n += b;
    }
    out.push(cur);
    return out.join('\r\n ');
  }
  const p2 = (n) => String(n).padStart(2, '0');
  function utcStamp(y, m, d, min) {
    const t = new Date(Date.UTC(y, m - 1, d, 0, 0) + (min - 9 * 60) * 60000);
    return t.getUTCFullYear() + p2(t.getUTCMonth() + 1) + p2(t.getUTCDate()) + 'T' + p2(t.getUTCHours()) + p2(t.getUTCMinutes()) + '00Z';
  }
  const dstr = (y, m, d) => y + p2(m) + p2(d);
  function nextDay(y, m, d) {
    const t = new Date(y, m - 1, d + 1);
    return dstr(t.getFullYear(), t.getMonth() + 1, t.getDate());
  }

  function summaryText(p, st) {
    if (p.kind === 'work') return p.label + (p.color ? '（' + (KH.COLORS.find((x) => x.id === p.color) || {}).name + '）' : '') + ' ' + p.s + '-' + p.e;
    if (p.kind === 'time') return p.s + '-' + p.e;
    if (p.kind === 'off' || p.kind === 'paid') return p.name || p.label;
    return '';
  }
  function detailText(p) {
    const L = [];
    if (p.kind === 'work') L.push('勤務：' + p.label + (p.name ? '（' + p.name + '）' : ''), '時間：' + p.s + '〜' + p.e);
    if (p.kind === 'time') L.push('時間：' + p.s + '〜' + p.e);
    if (p.adj) L.push('過不足：' + U.fmtH(p.adj, true) + '時間');
    if (p.tag) L.push(p.tag.name);
    if (p.note) L.push('メモ：' + p.note);
    if (p.ev) L.push('園の行事：' + p.ev.replace(/／/g, '・'));
    return L.join('\n');
  }

  function buildICS(m, st, opt) {
    const cm = M.codeMap(m);
    const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//kinmu-hyo//JA', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:' + icsEsc(st.name + ' 勤務')];
    const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
    for (const di of M.dayInfos(m)) {
      const p = dayParts(m, cm, st, di);
      if (!['work', 'time', 'off', 'paid'].includes(p.kind)) continue;
      if ((p.kind === 'off' || p.kind === 'paid') && !opt.off) continue;
      L.push('BEGIN:VEVENT', 'UID:kinmu-' + dstr(m.y, m.m, di.d) + '-' + st.id + '@kinmu-hyo', 'DTSTAMP:' + stamp);
      const sm = p.inf.s, em = p.inf.e;
      if (opt.timed && (p.kind === 'work' || p.kind === 'time') && sm != null && em != null) {
        L.push('DTSTART:' + utcStamp(m.y, m.m, di.d, sm), 'DTEND:' + utcStamp(m.y, m.m, di.d, em));
      } else {
        L.push('DTSTART;VALUE=DATE:' + dstr(m.y, m.m, di.d), 'DTEND;VALUE=DATE:' + nextDay(m.y, m.m, di.d), 'TRANSP:TRANSPARENT');
      }
      L.push(fold('SUMMARY:' + icsEsc((opt.prefix ? opt.prefix + ' ' : '') + summaryText(p, st))));
      const det = [detailText(p), '出典：' + m.title + '（' + U.wareki(m.y) + '年' + m.m + '月）'].filter(Boolean).join('\n');
      L.push(fold('DESCRIPTION:' + icsEsc(det)), 'END:VEVENT');
    }
    L.push('END:VCALENDAR');
    return L.join('\r\n') + '\r\n';
  }

  function icsDialog(st) {
    const m = mo();
    const dlg = KH.dialogs.modal(KH.dialogs.head('カレンダーに書き出す（' + st.name + '）') + '<div class="dlg-body">' +
      '<p>' + m.y + '年' + m.m + '月の勤務を、Googleカレンダーや iPhone・Mac のカレンダーに取りこめるファイル（.ics）にします。</p>' +
