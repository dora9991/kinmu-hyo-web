      '<label class="check"><input type="radio" name="icsT" value="all" checked><span><b>終日の予定</b>として入れる（おすすめ）<br><span class="muted">「R 7:15-16:15」のように、題名に時間が入ります。ほかの予定のじゃまになりません</span></span></label>' +
      '<label class="check"><input type="radio" name="icsT" value="timed"><span><b>時間つきの予定</b>として入れる<br><span class="muted">カレンダーの時間の欄に、勤務の時間帯として表示されます</span></span></label>' +
      '<label class="check"><input type="checkbox" id="icsOff" checked><span>休み・有給の日も入れる</span></label>' +
      '<div class="frow"><label>題名の頭につける言葉</label><input class="txt" id="icsPre" value="' + esc(st.name.replace(/^(\S{1,3})\S*$/, '$1')) + '" style="width:140px"> <span class="muted">空でもOK</span></div>' +
      '<p class="muted">取りこみ方：iPhone・Mac はファイルを開くだけ。Googleカレンダーはパソコンで「設定 → インポート」。同じ月をもう一度取りこむと二重になるので、作り直したときは古い予定を消してから。</p>' +
      '</div><div class="dlg-foot"><button class="btn" data-close>やめる</button><button class="btn primary" id="icsGo">書き出す</button></div>', { narrow: true });
    dlg.querySelector('#icsGo').onclick = () => {
      const timed = dlg.querySelector('input[name="icsT"]:checked').value === 'timed';
      const txt = buildICS(m, st, { timed, off: dlg.querySelector('#icsOff').checked, prefix: dlg.querySelector('#icsPre').value.trim() });
      download(st.name + '_' + m.y + '年' + m.m + '月_勤務.ics', txt, 'text/calendar');
      KH.dialogs.close();
      KH.app.toast('カレンダーのファイルを書き出しました');
    };
  }

  // スマホで見るための1ファイルのページ（LINE・メールで送れる）
  function phonePage(m, st) {
    const cm = M.codeMap(m);
    const s = M.staffSummary(m, st, cm);
    const days = M.dayInfos(m);
    const ics = buildICS(m, st, { timed: false, off: true, prefix: '' });
    const COL = { green: '#b4d8bc', blue: '#8db2e8', sky: '#c2e1f5', yellow: '#fff09a', orange: '#f8c58e', pink: '#f3bcd0', purple: '#d8c5f0', gray: '#d5d5d5' };
    let rows = '';
    for (const di of days) {
      const p = dayParts(m, cm, st, di);
      const cls = di.hol || di.dow === 0 ? 'sun' : di.dow === 6 ? 'sat' : '';
      let mid = '';
      if (p.kind === 'work' || p.kind === 'time') {
        mid = '<span class="b" style="background:' + (COL[p.color] || '#eee') + '">' + esc(p.label) + '</span><b class="t">' + esc(p.s) + '〜' + esc(p.e) + '</b>' + (p.name ? '<div class="n">' + esc(p.name) + '</div>' : '');
      } else if (p.kind === 'off' || p.kind === 'paid') mid = '<span class="b off">' + esc(p.label) + '</span><span class="n">' + esc(p.name) + '</span>';
      else mid = '<span class="n">—</span>';
      const sub = [];
      if (p.adj) sub.push(p.kind === 'time' ? '<span class="n">（' + U.fmtH(p.adj) + '時間）</span>' : '<span class="x">' + (p.adj > 0 ? '＋' : '−') + U.fmtH(Math.abs(p.adj)) + '時間</span>');
      if (p.tag) sub.push('<span class="tg" style="background:' + (COL[p.tag.color] || '#eee') + '">' + esc(p.tag.name) + '</span>');
      if (p.note) sub.push('<span class="n">' + esc(p.note) + '</span>');
      if (p.ev) sub.push('<span class="ev">📌 ' + esc(p.ev.replace(/／/g, '・')) + '</span>');
      rows += '<tr class="' + (di.yellow ? 'yl' : '') + '" data-d="' + di.d + '"><td class="d ' + cls + '">' + di.d + '<small>(' + di.wd + ')</small></td><td>' + mid + (sub.length ? '<div class="s">' + sub.join(' ') + '</div>' : '') + '</td></tr>';
    }
    const legend = m.codes.filter((c) => c.kind === 'work').map((c) => '<span><span class="b" style="background:' + (COL[c.color] || '#eee') + '">' + esc(c.label) + '</span> ' + esc((c.name ? c.name + ' ' : '') + c.start + '〜' + c.end) + '</span>').join('');
    const fname = st.name + '_' + m.y + '年' + m.m + '月_勤務.ics';
    return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>' + esc(st.name) + ' ' + m.m + '月の勤務</title><style>' +
      ':root{color-scheme:light}body{margin:0;background:#f4f3ef;color:#1d2126;font-family:-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}.w{max-width:640px;margin:0 auto;padding:16px 12px 40px}h1{font-size:20px;margin:0}.sub{color:#666;font-size:13px;margin:2px 0 12px}' +
      '.st{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.st div{background:#fff;border:1px solid #ddd;border-radius:10px;padding:6px 12px}.st small{display:block;font-size:11px;color:#777}.st b{font-size:18px}' +
      'table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;border:1px solid #ddd}td{padding:8px 10px;border-top:1px solid #eee;vertical-align:middle;font-size:15px}tr.yl td{background:#fff9dc}tr.today td{background:#e8eefc}' +
      '.d{width:56px;font-weight:800;font-size:17px;white-space:nowrap}.d small{font-size:11px;font-weight:500;margin-left:2px}.sun{color:#c0392b}.sat{color:#2b62c0}' +
      '.b{display:inline-block;min-width:30px;text-align:center;border-radius:6px;font-weight:800;padding:2px 6px;border:1px solid rgba(0,0,0,.15);margin-right:8px}.b.off{background:#fdf6d3}.t{font-size:17px}.n{font-size:12px;color:#555}.s{margin-top:3px;font-size:12.5px;display:flex;gap:6px;flex-wrap:wrap}.x{color:#b3261e;font-weight:700}.tg{border-radius:5px;padding:0 6px}.ev{color:#9a4a00}' +
      '.btn{display:inline-block;background:#2459d8;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-size:15px;font-weight:700;margin:14px 0 6px;cursor:pointer}.lg{font-size:12.5px;display:flex;flex-direction:column;gap:4px;margin-top:14px;color:#444}.foot{font-size:11.5px;color:#888;margin-top:14px}' +
      '</style></head><body><div class="w"><h1>' + esc(st.name) + 'さんの勤務</h1><div class="sub">' + m.y + '年' + m.m + '月（' + U.wareki(m.y) + '年）・' + esc(m.title) + '</div>' +
      '<div class="st"><div><small>出勤</small><b>' + s.days + '</b>日</div><div><small>休み</small><b>' + ((s.counts['休'] || 0) + (s.counts['有'] || 0)) + '</b>日</div><div><small>実績時間</small><b>' + U.fmtH(s.actual) + '</b>時間</div></div>' +
      '<table>' + rows + '</table><button class="btn" id="ics">📅 カレンダーにまとめて入れる（.ics）</button><div class="lg">' + legend + '</div><div class="foot">作成：' + new Date().toLocaleString('ja-JP') + '。内容が変わったときは、新しいページを受け取ってください。</div></div>' +
      '<script>var ICS=' + JSON.stringify(ics).replace(/</g, '\\u003c') + ';document.getElementById("ics").onclick=function(){var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([ICS],{type:"text/calendar"}));a.download=' + JSON.stringify(fname) + ';document.body.appendChild(a);a.click();a.remove();};' +
      'var n=new Date();if(n.getFullYear()===' + m.y + '&&n.getMonth()+1===' + m.m + '){var r=document.querySelector(\'tr[data-d="\'+n.getDate()+\'"]\');if(r){r.className+=" today";r.scrollIntoView({block:"center"});}}<\/script></body></html>';
  }

  // 表計算ソフト用（CSV）
  function csv(m) {
    const cm = M.codeMap(m);
    const days = M.dayInfos(m);
    const cols = M.summaryCols(m);
    const q = (s) => '"' + String(s == null ? '' : s).replace(/"/g, '""') + '"';
    const L = [];
    L.push([q('氏名'), ...days.map((d) => q(d.d + '(' + d.wd + ')')), ...cols.letters.map(q), ...cols.paid.map(q), q('計'), ...cols.off.map(q), q('時間数'), q('過不足'), q('実績時間数'), q('超過')].join(','));
    for (const st of m.staff) {
      const s = M.staffSummary(m, st, cm);
      const cells = days.map((di) => {
        const p = dayParts(m, cm, st, di);
        let t = '';
        const cn = p.color ? '(' + ((KH.COLORS.find((x) => x.id === p.color) || {}).name || '') + ')' : '';
        if (p.kind === 'work') t = p.label + cn + (p.sCh || p.eCh ? ' ' + p.s + '-' + p.e : '');
        else if (p.kind === 'time') t = p.s + '-' + p.e;
        else if (p.label) t = p.label;
        if (p.adj) t += ' (' + U.fmtH(p.adj, true) + ')';
        if (p.note) t += ' ' + p.note;
        return q(t.trim());
      });
      L.push([q(st.name), ...cells, ...cols.letters.map((c) => s.counts[c] || 0), ...cols.paid.map((c) => s.counts[c] || 0), s.total, ...cols.off.map((c) => s.counts[c] || 0), s.hours, s.adj, s.actual, s.over == null ? '' : s.over].join(','));
    }
    L.push([q('行事'), ...days.map((di) => q((m.events[di.d] || '').replace(/／/g, ' / ')))].join(','));
    return L.join('\r\n');
  }

  KH.views = { renderPerson, renderDayView, dayParts, buildICS, phonePage, csv, download };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 印刷：原本と同じ形の表（A3横／B4横／A4横）と、個人の予定（A4縦）
(function (g) {
  const KH = (g.KH = g.KH || {});
  const U = KH.util;
  const M = KH.model;
  const ST = KH.store;
  const esc = U.esc;
  const mo = () => ST.S.mo;

  const PAPER = {
    A3: { css: 'A3 landscape', zoom: 1, name: 'A3 横' },
    B4: { css: '364mm 257mm', zoom: 0.866, name: 'B4 横' },
    A4: { css: 'A4 landscape', zoom: 0.705, name: 'A4 横' },
  };

  function opts() {
    const o = ST.pref('print') || {};
    return Object.assign({ paper: 'A3', color: true, sum: true, events: true, legend: true, stamps: true, org: '' }, o);
  }

  const evHTML = (ev) => esc(ev || '').replace(/／/g, '<br>');

  // 用紙の高さ（A3の大きさに直した、使える高さ mm）
  function availHeight(o) {
    const pz = PAPER[o.paper] || PAPER.A3;
    const h = o.paper === 'A3' ? 297 : o.paper === 'B4' ? 257 : 210;
    return (h - 12) / pz.zoom - 3;
  }

  // 実際に並べて高さを測り、1枚に入るまで行の高さを縮める
  function fitSheet(m, o) {
    const avail = availHeight(o);
    const probe = document.createElement('div');
    probe.style.cssText = 'position:absolute;left:-10000px;top:0;visibility:hidden;width:420mm';
    document.body.appendChild(probe);
    const px2mm = 25.4 / 96;
    let rowH = null, html = '';
    for (let i = 0; i < 6; i++) {
      html = sheetHTML(m, o, rowH);
      probe.innerHTML = html;
      const sh = probe.firstElementChild;
      const hmm = sh.offsetHeight * px2mm;
      const cur = rowH || +sh.dataset.rowh;
      if (hmm <= avail || cur <= 5.5) break;
      rowH = Math.max(5.5, cur - (hmm - avail) / Math.max(1, m.staff.length) - 0.05);
    }
    probe.remove();
    return html;
  }

  // 原本の形の表
  function sheetHTML(m, o, rowHFix) {
    const cm = M.codeMap(m);
    const days = M.dayInfos(m);
    const cols = M.summaryCols(m);
    const nL = cols.letters.length, nP = cols.paid.length, nO = cols.off.length;
    const W = 404;
    const stampsW = o.stamps && m.stamps.length ? 20 : 0;
    const nameW = 21;
    const wS = 4.4, wT = 5.4, wH = 8.6, wO = 8.6, wR = 10;
    const sumW = o.sum ? (nL + nP + nO) * wS + wT + wH + wO + wR : 0;
    const dayW = Math.min(10.5, (W - stampsW - nameW - sumW) / days.length);
    const legendBelow = o.legend && !o.sum;
    // 行の高さ：人数が多いときは縮める（用紙の高さに入るように。最後は fitSheet で実測して調整）
    const avail = availHeight(o) - 9 - 7.5 - (o.events ? 37 : 0) - (legendBelow ? 36 : 0) - 2;
    const rowH = rowHFix || Math.max(6, Math.min(12.5, avail / Math.max(1, m.staff.length)));
    const tH = rowH * 0.62, bH = rowH - tH;
    const yl = (di) => (di.yellow ? ' yl' : '');

    let h = '<div class="sheet' + (o.color ? '' : ' mono') + '" data-rowh="' + rowH.toFixed(2) + '">';
    h += '<div class="sh-top"><div class="sh-title">' + esc(m.title) + '（' + U.wareki(m.y) + '年 ' + m.m + '月）</div><div class="sh-kitei">規定 ' + esc(U.fmtH(m.kitei)) + '</div>' + (o.org ? '<div class="sh-org">' + esc(o.org) + '</div>' : '') + '</div>';
    h += '<div class="sh-body"><table class="main"><colgroup><col style="width:' + nameW + 'mm">';
    for (let i = 0; i < days.length; i++) h += '<col style="width:' + dayW.toFixed(2) + 'mm">';
    if (o.sum) {
      for (let i = 0; i < nL + nP; i++) h += '<col style="width:' + wS + 'mm">';
      h += '<col style="width:' + wT + 'mm">';
      for (let i = 0; i < nO; i++) h += '<col style="width:' + wS + 'mm">';
      h += '<col style="width:' + wH + 'mm"><col style="width:' + wO + 'mm"><col style="width:' + wR + 'mm">';
    }
    h += '</colgroup><thead><tr class="hd"><th class="nmh" rowspan="2" style="height:7mm">氏　名</th>';
    for (const di of days) h += '<th class="' + yl(di).trim() + '">' + di.d + '</th>';
    if (o.sum) {
      for (const c of [...cols.letters, ...cols.paid]) h += '<th class="sumh" rowspan="2">' + esc(c) + '</th>';
      h += '<th class="sumh" rowspan="2">計</th>';
      for (const c of cols.off) h += '<th class="sumh" rowspan="2">' + esc(c) + '</th>';
      h += '<th class="sumh" rowspan="2">時間数</th><th class="sumh" rowspan="2">超過</th><th class="sumh" rowspan="2" style="font-size:5pt">今月不足分</th>';
    }
    h += '</tr><tr>';
    for (const di of days) h += '<th class="' + yl(di).trim() + '">' + di.wd + '</th>';
    h += '</tr></thead><tbody>';

    for (const st of m.staff) {
      const s = M.staffSummary(m, st, cm);
      let r1 = '<tr class="r1"><td class="nm" rowspan="2">' + esc(st.name) + '</td>';
      let r2 = '<tr class="r2">';
      for (const di of days) {
        const cell = m.cells[st.id] && m.cells[st.id][di.d];
        const inf = M.cellInfo(m, cell, cm, st);
        const tag = cell && cell.tag ? m.tags.find((t) => t.id === cell.tag) : null;
        let top = '', tcls = 't' + yl(di), bcls = 'b' + yl(di);
        if (inf.kind === 'work') {
          if (inf.code.color) tcls += ' c-' + inf.code.color;
          const tt = M.timeText(inf);
          top = esc(inf.code.label) + (tt ? '<span class="tt">' + esc(tt) + '</span>' : '');
          if (tt) tcls += ' chg';
        } else if (inf.kind === 'time') {
          tcls += ' tm';
          if (tag && tag.color) tcls += ' c-' + tag.color;
          top = '<span class="nw">' + (inf.s != null ? U.fmtTime(inf.s) : '') + '</span><br><span class="nw">〜' + (inf.e != null ? U.fmtTime(inf.e) : '') + '</span>';
        } else if (inf.kind === 'off' || inf.kind === 'paid') {
          if (inf.code.color) tcls += ' c-' + inf.code.color;
          top = esc(inf.code.label);
        } else if (inf.kind === 'unknown') top = esc(inf.label);
        if (tag && tag.color && inf.kind !== 'time') bcls += ' c-' + tag.color;
        const bot = [];
        if (cell && cell.n) bot.push(esc(cell.n));
        if (inf.adj) bot.push(U.fmtH(inf.adj));
        r1 += '<td class="' + tcls + '" style="height:' + tH.toFixed(2) + 'mm">' + top + '</td>';
        r2 += '<td class="' + bcls + '" style="height:' + bH.toFixed(2) + 'mm">' + bot.join(' ') + '</td>';
      }
      if (o.sum) {
        for (const c of [...cols.letters, ...cols.paid]) r1 += '<td class="s">' + (s.counts[c] || 0) + '</td>';
        r1 += '<td class="s">' + s.total + '</td>';
        for (const c of cols.off) r1 += '<td class="s">' + (s.counts[c] || 0) + '</td>';
        r1 += '<td class="s">' + U.fmtH(s.hours) + '</td><td class="s">' + (s.over == null ? '' : U.fmtH(s.over)) + '</td><td class="s"></td>';
        r2 += '<td class="s lbl" colspan="' + nL + '">過不足</td><td class="s" colspan="' + (nP + 1) + '">' + U.fmtH(s.adj) + '</td>';
        r2 += '<td class="s lbl" colspan="' + Math.max(1, nO) + '" style="font-size:5pt">実績時間数</td><td class="s">' + U.fmtH(s.actual) + '</td>';
        r2 += '<td class="s lbl" style="font-size:5pt">' + (s.over == null ? '' : '今月計→') + '</td><td class="s">' + (s.over == null ? '' : U.fmtH(s.over)) + '</td>';
      }
      h += r1 + '</tr>' + r2 + '</tr>';
    }
    h += '</tbody>';
    if (o.events) {
      h += '<tfoot><tr><td class="nm" style="font-size:7pt">行　事</td>';
      for (const di of days) {
        const ev = m.events[di.d] || '';
        h += '<td class="evc' + yl(di) + '"><div class="evtx' + (ev.length > 12 ? ' long' : '') + '">' + evHTML(ev) + '</div></td>';
      }
      if (o.sum) {
        const span = nL + nP + 1 + nO + 3;
        h += '<td colspan="' + span + '" style="vertical-align:top;padding:1mm;border:0">' + (o.legend ? legendHTML(m, true) : '') + '</td>';
      }
      h += '</tr></tfoot>';
    }
    h += '</table>';
    if (stampsW) {
      h += '<table class="stamps" style="margin-top:9mm">';
      for (const s of m.stamps) h += '<tr><td class="sl">' + esc(s) + '</td></tr><tr><td class="sb"></td></tr>';
      h += '</table>';
    }
    h += '</div>';
    if (legendBelow || (o.legend && !o.events && o.sum)) h += '<div class="sh-foot">' + legendHTML(m, false) + '</div>';
    h += '</div>';
    return h;
  }

  function legendHTML(m, compact) {
    const work = m.codes.filter((c) => c.kind === 'work');
    const half = Math.ceil(work.length / 2);
    const cellsOf = (c) => (c ? '<td class="k' + (c.color ? ' c-' + c.color : '') + '">' + esc(c.label) + '</td><td class="nm2">' + esc(c.name || '') + '</td><td class="tm2">' + esc(c.start + '〜' + c.end) + '（' + U.fmtH(c.hours) + '）</td>' : '<td class="k"></td><td class="nm2"></td><td class="tm2"></td>');
    let h = '<table class="legend"' + (compact ? ' style="width:100%"' : '') + '>';
    for (let i = 0; i < half; i++) h += '<tr>' + cellsOf(work[i]) + cellsOf(work[i + half]) + '</tr>';
    h += '</table>';
    if (m.tags.length) h += '<div class="tagleg">' + m.tags.map((t) => '<span class="c-' + esc(t.color) + '">' + esc(t.name) + '</span>').join('') + '</div>';
    return h;
  }

  // 個人の予定（A4縦のカレンダー）
  function personHTML(m, st) {
    const cm = M.codeMap(m);
    const days = M.dayInfos(m);
    const s = M.staffSummary(m, st, cm);
    let h = '<div class="psheet"><h1>' + esc(st.name) + 'さん　' + m.y + '年' + m.m + '月（' + U.wareki(m.y) + '年）の勤務</h1>';
    h += '<div class="ps-sub">出勤 ' + s.days + '日・休み ' + ((s.counts['休'] || 0) + (s.counts['有'] || 0)) + '日・実績 ' + U.fmtH(s.actual) + '時間' + (s.over != null ? '（規定 ' + U.fmtH(m.kitei) + '・超過 ' + U.fmtH(s.over, true) + '）' : '') + '</div>';
    h += '<table class="pcal"><thead><tr>' + U.WD.map((w) => '<th>' + w + '</th>').join('') + '</tr></thead><tbody><tr>';
    const lead = days[0].dow;
    for (let i = 0; i < lead; i++) h += '<td class="out"></td>';
    let col = lead;
    for (const di of days) {
      if (col === 7) { h += '</tr><tr>'; col = 0; }
      const p = KH.views.dayParts(m, cm, st, di);
      let body = '';
      if (p.kind === 'work' || p.kind === 'time') body = '<span class="pc' + (p.color ? ' c-' + p.color : '') + '">' + esc(p.label) + '</span><div class="pt">' + esc(p.s) + '〜' + esc(p.e) + '</div>' + (p.name ? '<div class="pe">' + esc(p.name) + '</div>' : '');
      else if (p.label) body = '<span class="pc">' + esc(p.label) + '</span>';
      if (p.adj) body += '<div class="pe">' + (p.kind === 'time' ? '（' + U.fmtH(p.adj) + '時間）' : (p.adj > 0 ? '＋' : '−') + U.fmtH(Math.abs(p.adj)) + '時間') + '</div>';
      if (p.tag) body += '<div class="pe c-' + esc(p.tag.color) + '" style="display:inline-block;padding:0 1mm">' + esc(p.tag.name) + '</div>';
      if (p.note) body += '<div class="pe">' + esc(p.note) + '</div>';
      if (p.ev) body += '<div class="pe">📌' + esc(p.ev.replace(/／/g, '・')) + '</div>';
      h += '<td class="' + (di.yellow ? 'yl' : '') + '"><div class="pd">' + di.d + '</div>' + body + '</td>';
      col++;
    }
    while (col < 7) { h += '<td class="out"></td>'; col++; }
    h += '</tr></tbody></table><div style="margin-top:3mm">' + legendHTML(m, false) + '</div></div>';
    return h;
  }

  function fillRoot(html, pageCss, zoom) {
    const root = document.getElementById('print-root');
    root.innerHTML = html;
    const sh = root.firstElementChild;
    if (sh && zoom && zoom !== 1) sh.style.zoom = zoom;
    let st = document.getElementById('page-style');
    if (!st) { st = document.createElement('style'); st.id = 'page-style'; document.head.appendChild(st); }
    st.textContent = '@page { size: ' + pageCss + '; margin: 6mm; }';
    root.dataset.ready = '1';
  }
  function printHTML(html, pageCss, zoom) {
    fillRoot(html, pageCss, zoom);
    setTimeout(() => window.print(), 60);
  }
  // 印刷の準備だけ（テストや、ブラウザのメニューから印刷したとき用）
  function prepare(o) {
    o = o || opts();
    fillRoot(fitSheet(mo(), o), PAPER[o.paper].css, PAPER[o.paper].zoom);
  }

  // ───────── 印刷プレビュー ─────────
  let pp = null;
  function open() {
    close();
    const o = opts();
    pp = document.createElement('div');
    pp.className = 'pp';
    const chk = (k, label) => '<label class="check"><input type="checkbox" data-o="' + k + '"' + (o[k] ? ' checked' : '') + '><span>' + label + '</span></label>';
    pp.innerHTML = '<div class="pp-side"><h2>印刷</h2><div class="muted" style="font-size:12.5px">原本と同じ形で印刷します。PDFにしたいときは、印刷の画面で「PDFに保存」を選びます。</div>' +
      '<div><div class="lbl-s" style="margin:6px 0 4px">用紙</div><div class="seg">' + Object.keys(PAPER).map((k) => '<button data-paper="' + k + '" class="' + (o.paper === k ? 'on' : '') + '">' + PAPER[k].name + '</button>').join('') + '</div></div>' +
      chk('color', '色をつける') + chk('sum', '右の集計欄') + chk('events', '行事の欄') + chk('legend', '記号の説明（凡例）') + chk('stamps', '押印欄（' + esc(mo().stamps.join('・') || 'なし') + '）') +
      '<div><div class="lbl-s" style="margin:6px 0 4px">右上に入れる文字（園名など・空でOK）</div><input class="txt" data-o="org" value="' + esc(o.org || '') + '" style="width:100%"></div>' +
      '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn primary" id="ppGo">🖨 印刷する</button><button class="btn" id="ppClose">閉じる</button></div>' +
      '<div class="muted" style="font-size:12px">印刷の画面で「倍率」や「余白」を変えないと、ちょうど1枚に入ります。うまく入らないときは「用紙に合わせる」を選んでください。</div></div>' +
      '<div class="pp-stage"><div class="pp-paper"></div></div>';
    document.body.appendChild(pp);
    const paper = pp.querySelector('.pp-paper');
    const draw = () => {
      const oo = opts();
      paper.innerHTML = fitSheet(mo(), oo);
      const pz = PAPER[oo.paper];
      // 紙の大きさ（横）
      const wmm = oo.paper === 'A3' ? 420 : oo.paper === 'B4' ? 364 : 297;
      const hmm = oo.paper === 'A3' ? 297 : oo.paper === 'B4' ? 257 : 210;
      const pxmm = 96 / 25.4;
      paper.style.width = wmm * pxmm + 'px';
      paper.style.height = hmm * pxmm + 'px';
      paper.style.padding = 6 * pxmm + 'px';
      paper.firstElementChild.style.zoom = pz.zoom;
      const stage = pp.querySelector('.pp-stage');
      const sc = Math.min((stage.clientWidth - 48) / (wmm * pxmm), (stage.clientHeight - 48) / (hmm * pxmm), 1.2);
      paper.style.transform = 'scale(' + sc + ')';
      paper.style.marginBottom = -(1 - sc) * hmm * pxmm + 'px';
      // はみ出しの確認
      const inner = paper.firstElementChild;
      const over = inner.scrollHeight * pz.zoom > (hmm - 12) * pxmm + 2 || inner.scrollWidth * pz.zoom > (wmm - 12) * pxmm + 2;
      pp.querySelector('#ppWarn') && pp.querySelector('#ppWarn').remove();
      if (over) {
        const w = document.createElement('div');
        w.id = 'ppWarn';
        w.className = 'note-s';
        w.style.color = 'var(--warn)';
        w.textContent = '⚠ この用紙だと少しはみ出します。印刷の画面で「用紙に合わせる」を選ぶか、A3にしてください。';
        pp.querySelector('.pp-side').appendChild(w);
      }
    };
    draw();
    pp.addEventListener('click', (e) => {
      const b = e.target.closest('[data-paper]');
      if (b) {
        ST.pref('print', Object.assign(opts(), { paper: b.dataset.paper }));
        for (const x of pp.querySelectorAll('[data-paper]')) x.classList.toggle('on', x === b);
        draw();
      }
    });
    pp.addEventListener('change', (e) => {
      const k = e.target.dataset.o;
      if (!k) return;
      ST.pref('print', Object.assign(opts(), { [k]: e.target.type === 'checkbox' ? e.target.checked : e.target.value }));
      draw();
    });
    pp.querySelector('#ppClose').onclick = close;
    pp.querySelector('#ppGo').onclick = () => {
      const oo = opts();
      printHTML(fitSheet(mo(), oo), PAPER[oo.paper].css, PAPER[oo.paper].zoom);
    };
    pp.tabIndex = -1;
    pp.focus();
    pp.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close();
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'p') { e.preventDefault(); pp.querySelector('#ppGo').click(); }
      e.stopPropagation();
    });
    window.addEventListener('resize', draw);
    pp._draw = draw;
  }
  function close() {
    if (pp) {
      window.removeEventListener('resize', pp._draw);
      pp.remove();
      pp = null;
      KH.grid.focus();
    }
  }

  function person(staffId) {
    const m = mo();
    const st = m.staff.find((s) => s.id === staffId);
    if (!st) return;
    printHTML(personHTML(m, st), 'A4 portrait', 1);
  }

  // ブラウザのメニューから印刷したときも、表が出るように
  window.addEventListener('beforeprint', () => {
    const root = document.getElementById('print-root');
    if (root && !root.dataset.ready) {
      if (KH.app.view() === 'person' && ST.pref('person')) {
        const st = mo().staff.find((s) => s.id === ST.pref('person'));
        if (st) return fillRoot(personHTML(mo(), st), 'A4 portrait', 1);
      }
      prepare();
    }
  });
  window.addEventListener('afterprint', () => {
    const root = document.getElementById('print-root');
    if (root) { root.innerHTML = ''; delete root.dataset.ready; }
  });

  KH.print = { open, close, person, sheetHTML, fitSheet, personHTML, prepare, opts, PAPER, isOpen: () => !!pp };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 使い方のデモ：練習用の架空のデータで、実際の画面を自動で動かして見せる。
// 本物のデータには触れず、保存もしない（store.js の「練習用」に切りかえて動かす）。
// 場面（SCENES）は、実際の画面のボタン・キー・マウスと同じ操作を送って動かすので、
// 画面のしくみそのものの確認（テスト）にもなる（tests/e2e-tour.cjs が通しで動かす）。
(function (g) {
  const KH = (g.KH = g.KH || {});
  const U = KH.util;
  const M = KH.model;
  const ST = KH.store;
  const esc = U.esc;

  const IS_MAC = /Mac|iPhone|iPad/i.test((g.navigator && g.navigator.platform) || '');
  const MOD = IS_MAC ? '⌘' : 'Ctrl';

  class Stop extends Error {}
  const tick = () => new Promise((r) => setTimeout(r, 0));
  const $ = (id) => document.getElementById(id);

  const T = {
    on: false,
    token: 0, // 場面の実行ごとに増える。古い実行はこれで止まる
    idx: 0,
    paused: false,
    skip: false, // 「次へ」：いまの場面を一気に終わらせる
    fast: false, // 画面の動きなしで、操作だけ一気に流す（戻る・ジャンプ・テスト）
    practice: false,
    finished: false,
    speed: 1, // 1＝ふつう、1.7＝ゆっくり
    standalone: false, // パスワードなしのデモ（本物のデータを読み込んでいない）
    el: {},
    saved: null,
    side: 'br',
    keyT: 0,
    errors: [],
  };

  // ───────── 画面の部品 ─────────
  function buildUI() {
    const layer = document.createElement('div');
    layer.id = 'tour';
    layer.innerHTML =
      '<div class="tour-shield"></div>' +
      '<div class="tour-ring" hidden></div>' +
      '<div class="tour-cursor" hidden><svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path d="M5 3l14 8.4-6.2 1.5L9.4 19.2z" fill="#fff" stroke="#14171c" stroke-width="1.7" stroke-linejoin="round"/></svg><i class="tour-ripple"></i></div>' +
      '<div class="tour-key" hidden></div>' +
      '<section class="tour-panel" data-side="br" data-state="play" role="dialog" aria-label="使い方のデモ">' +
      '<div class="tp-top"><span class="tp-badge">使い方のデモ</span><span class="tp-step"></span><button class="tp-x" data-t="exit" title="デモを終わる（Esc）" aria-label="デモを終わる">✕</button></div>' +
      '<h3 class="tp-title"></h3>' +
      '<div class="tp-body" aria-live="polite"></div>' +
      '<div class="tp-dots"></div>' +
      '<div class="tp-ctl"><button data-t="prev">◀ 戻る</button><button data-t="pause" class="tp-pause"><span class="tp-pi">⏸</span> 止める</button><button data-t="next" class="tp-next">次へ ▶</button></div>' +
      '<div class="tp-sub"><span class="tp-speed">速さ <button data-t="speed" data-v="1.7">ゆっくり</button><button data-t="speed" data-v="1">ふつう</button></span><button data-t="practice" class="tp-link">自分で触ってみる</button></div>' +
      '<div class="tp-end"><button data-t="replay">もう一度見る</button><button data-t="practice">自分で触ってみる</button><button data-t="exit" class="tp-primary">デモを終わる</button></div>' +
      '<div class="tp-pr"><button data-t="replay">最初からデモを見る</button><button data-t="resetdata">練習用のデータを元にもどす</button><button data-t="exit" class="tp-primary">デモを終わる</button></div>' +
      '</section>';
    document.body.appendChild(layer);
    const q = (s) => layer.querySelector(s);
    T.el = {
      layer,
      shield: q('.tour-shield'),
      ring: q('.tour-ring'),
      cursor: q('.tour-cursor'),
      keys: q('.tour-key'),
      panel: q('.tour-panel'),
      step: q('.tp-step'),
      title: q('.tp-title'),
      body: q('.tp-body'),
      dots: q('.tp-dots'),
      pause: q('.tp-pause'),
      pi: q('.tp-pi'),
      prev: q('[data-t="prev"]'),
      next: q('.tp-next'),
    };
    T.el.dots.innerHTML = SCENES.map((s, i) => '<button data-t="go" data-i="' + i + '" title="' + esc(i + 1 + '. ' + s.title) + '" aria-label="' + esc(s.title) + '"></button>').join('');
    layer.addEventListener('click', onPanelClick);
    setSpeedUI();
    syncDock();
  }

  function removeUI() {
    if (T.el.layer) T.el.layer.remove();
    T.el = {};
  }

  function syncDock() {
    const dock = $('dock');
    document.documentElement.style.setProperty('--dockh', (dock ? dock.offsetHeight : 100) + 'px');
  }

  function setSpeedUI() {
    if (!T.el.panel) return;
    for (const b of T.el.panel.querySelectorAll('[data-t="speed"]')) b.classList.toggle('on', +b.dataset.v === T.speed);
  }

  function setState(s) {
    if (T.el.panel) T.el.panel.dataset.state = s;
    if (T.el.shield) T.el.shield.hidden = s === 'practice' || s === 'end';
    document.body.classList.toggle('tour-practice', s === 'practice' || s === 'end');
  }

  function renderStep() {
    if (!T.el.panel) return;
    T.el.step.textContent = T.idx + 1 + ' / ' + SCENES.length;
    const ds = T.el.dots.children;
    for (let i = 0; i < ds.length; i++) {
      ds[i].classList.toggle('on', i === T.idx);
      ds[i].classList.toggle('done', i < T.idx);
    }
    T.el.next.disabled = T.idx >= SCENES.length - 1;
  }

  // ───────── 位置の計算 ─────────
  function rectOf(t) {
    if (!t) return null;
    if (Array.isArray(t)) {
      const rs = t.filter(Boolean).map(rectOf).filter(Boolean);
      if (!rs.length) return null;
      return { left: Math.min(...rs.map((r) => r.left)), top: Math.min(...rs.map((r) => r.top)), right: Math.max(...rs.map((r) => r.right)), bottom: Math.max(...rs.map((r) => r.bottom)) };
    }
    if (t.getBoundingClientRect) {
      const r = t.getBoundingClientRect();
      let o = { left: r.left, top: r.top, right: r.right, bottom: r.bottom };
      // 表の中のものは、見えている範囲にそろえる（横に長い行など）
      const wrap = t.closest && t.closest('.grid-wrap');
      if (wrap) {
        const w = wrap.getBoundingClientRect();
        o = { left: Math.max(o.left, w.left), top: Math.max(o.top, w.top), right: Math.min(o.right, w.right), bottom: Math.min(o.bottom, w.bottom) };
      }
      return o;
    }
    return t; // すでに {left, top, right, bottom}
  }

  const hit = (a, b, pad) => a && b && a.left < b.right + pad && a.right > b.left - pad && a.top < b.bottom + pad && a.bottom > b.top - pad;

  // 解説のカードが、いま見せたい場所（や開いている入力画面）に重ならない隅へ動く
  function avoid(rects) {
    if (!T.el.panel || innerWidth < 760) return;
    const obs = rects.filter(Boolean);
    const pop = $('pop');
    if (pop && !pop.hidden) obs.push(pop.getBoundingClientRect());
    const dlg = document.querySelector('.modal-bg .dlg');
    if (dlg) obs.push(dlg.getBoundingClientRect());
    const W = innerWidth, H = innerHeight;
    const pw = Math.min(380, W - 16), ph = T.el.panel.offsetHeight || 240;
    const dockH = ($('dock') || {}).offsetHeight || 0;
    const topH = (($('main') || {}).getBoundingClientRect ? $('main').getBoundingClientRect().top : 100) + 8;
    const spots = {
      br: { left: W - pw - 12, top: H - dockH - ph - 12 },
      bl: { left: 12, top: H - dockH - ph - 12 },
      tr: { left: W - pw - 12, top: topH },
      tl: { left: 12, top: topH },
    };
    const order = [T.side, 'br', 'bl', 'tr', 'tl'];
    for (const s of order) {
      const p = spots[s];
      const r = { left: p.left, top: p.top, right: p.left + pw, bottom: p.top + ph };
      if (!obs.some((o) => hit(r, o, 10))) {
        T.side = s;
        T.el.panel.dataset.side = s;
        return;
      }
    }
  }

  // ───────── 本物の操作を送る ─────────
  function fireMouse(el, type) {
    const r = el.getBoundingClientRect ? el.getBoundingClientRect() : { left: 0, top: 0, width: 0, height: 0 };
    el.dispatchEvent(new MouseEvent(type, { bubbles: true, cancelable: true, view: g, button: 0, buttons: type === 'mouseup' ? 0 : 1, clientX: r.left + r.width / 2, clientY: r.top + r.height / 2 }));
  }
  function press(el) {
    if (el.matches && el.matches('td.cell, th.c-name, th.dh, th.corner, td.evc')) {
      fireMouse(el, 'mousedown');
      g.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, view: g, button: 0 }));
    } else el.click();
  }

  const NAMED = { enter: 'Enter', escape: 'Escape', delete: 'Delete', backspace: 'Backspace', tab: 'Tab', arrowright: 'ArrowRight', arrowleft: 'ArrowLeft', arrowdown: 'ArrowDown', arrowup: 'ArrowUp' };
  function dispatchKey(k, mods) {
    const ae = document.activeElement;
    let target;
    if (ae && ae !== document.body && ae.closest && ae.closest('#pop, .modal-bg')) target = ae;
    else {
      KH.grid.focus();
      target = KH.grid.G.wrap;
    }
    let key, code;
    if (NAMED[k]) key = code = NAMED[k];
    else if (/^[a-z]$/.test(k)) {
      key = mods.shift ? k.toUpperCase() : k;
      code = 'Key' + k.toUpperCase();
    } else key = code = k;
    target.dispatchEvent(new KeyboardEvent('keydown', { key, code, bubbles: true, cancelable: true, shiftKey: !!mods.shift, ctrlKey: !!mods.ctrl, metaKey: !!mods.meta }));
  }
  const KEYLABEL = { enter: 'Enter', escape: 'Esc', delete: 'Delete', shift: 'Shift', ctrl: 'Ctrl', mod: MOD, meta: '⌘' };

  // ───────── 場面で使う道具 ─────────
  function makeCtx(tok) {
    const chk = () => {
      if (tok !== T.token || !T.on) throw new Stop();
    };
    const quick = () => T.fast || T.skip;
    const mo = () => ST.S.mo;

    const c = {
      mo,
      row: (name) => mo().staff.findIndex((s) => s.name === name),
      days: () => M.dayInfos(mo()),

      async wait(ms) {
        chk();
        if (quick()) { await tick(); chk(); return; }
        let left = ms * T.speed;
        while (left > 0) {
          await new Promise((r) => setTimeout(r, 50));
          chk();
          if (quick()) break;
          if (!T.paused) left -= 50;
        }
      },

      title(t) { if (!T.fast && T.el.title) T.el.title.textContent = t; },
      cap(html) { if (!T.fast && T.el.body) T.el.body.innerHTML = html; },
      async say(html, ms) { c.cap(html); await c.wait(ms == null ? 3000 : ms); },

      // 見せたい場所を囲む
      ring(target, pad) {
        if (T.fast || !T.el.ring) return;
        const r = rectOf(target);
        if (!r) { T.el.ring.hidden = true; return; }
        const p = pad == null ? 4 : pad;
        const s = T.el.ring.style;
        T.el.ring.hidden = false;
        s.left = r.left - p + 'px';
        s.top = r.top - p + 'px';
        s.width = r.right - r.left + p * 2 + 'px';
        s.height = r.bottom - r.top + p * 2 + 'px';
        avoid([r]);
      },

      cell(r, d) {
        KH.grid.scrollToCell(r, d);
        const td = KH.grid.G.cells[r] && KH.grid.G.cells[r][d];
        if (!td) throw new Error('デモ：マスが見つかりません ' + r + ',' + d);
        return td;
      },
      chip(id) { return document.querySelector('#dock .chip[data-code="' + CSS.escape(id) + '"]'); },
      grid() { return KH.grid.G.wrap; },

      // マウスの矢印を動かす
      async point(target, opt) {
        chk();
        const r = rectOf(target);
        if (!r || T.fast || !T.el.cursor) return;
        const x = Math.round((r.left + r.right) / 2), y = Math.round((r.top + r.bottom) / 2);
        const ms = quick() ? 0 : Math.round(((opt && opt.ms) || 650) * Math.min(T.speed, 1.5));
        const s = T.el.cursor.style;
        T.el.cursor.hidden = false;
        s.transition = ms ? 'transform ' + ms + 'ms cubic-bezier(.35,.1,.2,1)' : 'none';
        s.transform = 'translate(' + x + 'px,' + y + 'px)';
        avoid([r]);
        if (ms) await c.wait(ms + 60);
      },
      async pulse() {
        if (T.fast || !T.el.cursor) return;
        T.el.cursor.classList.remove('click');
        void T.el.cursor.offsetWidth;
        T.el.cursor.classList.add('click');
        await c.wait(260);
      },
      async click(el) {
        chk();
        if (!el) throw new Error('デモ：押す場所が見つかりません');
        await c.point(el);
        await c.pulse();
        press(el);
        await tick();
        chk();
      },
      async drag(r0, d0, r1, d1) {
        chk();
        const a = c.cell(r0, d0);
        await c.point(a);
        await c.pulse();
        fireMouse(a, 'mousedown');
        const mid = c.cell(r0, d1);
        await c.point(mid, { ms: 500 });
        fireMouse(mid, 'mouseover');
        const b = c.cell(r1, d1);
        await c.point(b, { ms: 400 });
        fireMouse(b, 'mouseover');
        await c.wait(200);
        g.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, view: g, button: 0 }));
        await tick();
        chk();
      },

      // キーを押す：'r' 'shift+r' 'enter' 'mod+z'（mod は Mac で ⌘、Windows で Ctrl）
      async key(spec) {
        chk();
        const parts = spec.toLowerCase().split('+');
        const k = parts.pop();
        const mods = { shift: parts.includes('shift'), ctrl: parts.includes('ctrl') || (parts.includes('mod') && !IS_MAC), meta: parts.includes('meta') || (parts.includes('mod') && IS_MAC) };
        if (!T.fast && T.el.keys) {
          const labels = parts.map((p) => KEYLABEL[p] || p).concat([KEYLABEL[k] || k.toUpperCase()]);
          T.el.keys.innerHTML = labels.map((l) => '<kbd>' + esc(l) + '</kbd>').join('<i>＋</i>');
          T.el.keys.hidden = false;
          T.el.keys.classList.remove('hit');
          void T.el.keys.offsetWidth;
          T.el.keys.classList.add('hit');
          clearTimeout(T.keyT);
          T.keyT = setTimeout(() => { if (T.el.keys) T.el.keys.hidden = true; }, 1100 * Math.min(T.speed, 1.5));
          await c.wait(380);
        }
        dispatchKey(k, mods);
        // 画面のほうに「貼り付けは 60 ミリ秒あとに」などの待ちがある。一気に流すときも、実際の時間で少し待つ
        await new Promise((r) => setTimeout(r, 90));
        chk();
      },

      // 入力欄に、1文字ずつ打ち込む
      async type(input, text) {
        chk();
        if (!input) throw new Error('デモ：入力欄が見つかりません');
        await c.point(input, { ms: 450 });
        input.focus();
        if (T.fast || T.skip) input.value = text;
        else {
          input.value = '';
          for (const ch of text) {
            input.value += ch;
            await c.wait(170);
          }
          await c.wait(250);
        }
        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
        await tick();
        chk();
      },
    };
    return c;
  }

  // ───────── 進行 ─────────
  function clearStage() {
    try { KH.editor.close(true); } catch (e) { /* なし */ }
    try { if (KH.dialogs.isOpen()) KH.dialogs.close(); } catch (e) { /* なし */ }
    try { if (KH.print.isOpen()) KH.print.close(); } catch (e) { /* なし */ }
    const m = document.querySelector('.menu');
    if (m) m.remove();
    if (T.el.ring) T.el.ring.hidden = true;
    if (T.el.cursor) T.el.cursor.hidden = true;
    if (T.el.keys) T.el.keys.hidden = true;
  }

  // 練習用のデータを最初の状態にして、画面も全体の表（編集）にそろえる
  function resetStage() {
    clearStage();
    KH.grid.reset();
    KH.app.A.view = 'grid';
    KH.app.A.edit = true;
    ST.resetSandbox(KH.demo.data());
    syncDock();
  }

  async function runFrom(i0, tok) {
    for (let i = i0; i < SCENES.length; i++) {
      if (tok !== T.token || !T.on) return;
      T.idx = i;
      T.skip = false;
      renderStep();
      try {
        await SCENES[i].run(makeCtx(tok));
      } catch (e) {
        if (e instanceof Stop) return;
        console.error('デモの途中でエラー', e);
        T.errors.push(String((e && e.message) || e));
        if (T.el.body) T.el.body.innerHTML = '<p>デモの途中で止まりました。「戻る」か「自分で触ってみる」を押してください。</p>';
        return;
      }
      if (tok !== T.token || !T.on) return;
      if (i === SCENES.length - 1) break;
      const w = makeCtx(tok);
      try { await w.wait(900); } catch (e) { return; }
    }
    if (tok !== T.token || !T.on) return;
    T.finished = true;
    T.skip = false;
    setState('end');
    if (T.el.title) T.el.title.textContent = 'おしまい';
  }

  async function goto(j) {
    if (!T.on) return;
    j = Math.max(0, Math.min(SCENES.length - 1, j));
    const tok = ++T.token;
    T.finished = false;
    T.practice = false;
    T.paused = false;
    T.skip = false;
    setState('play');
    setPauseUI();
    resetStage();
    if (j > 0) {
      T.fast = true;
      if (T.el.title) T.el.title.textContent = '準備しています…';
      if (T.el.body) T.el.body.innerHTML = '';
      try {
        for (let i = 0; i < j; i++) {
          if (tok !== T.token || !T.on) return;
          T.idx = i;
          await SCENES[i].run(makeCtx(tok));
          clearStage();
        }
      } catch (e) {
        if (!(e instanceof Stop)) { console.error('デモの準備でエラー', e); T.errors.push(String((e && e.message) || e)); }
      } finally {
        T.fast = false;
      }
    }
    if (tok !== T.token || !T.on) return;
    await runFrom(j, tok);
  }

  function setPauseUI() {
    if (!T.el.pause) return;
    T.el.pause.innerHTML = T.paused ? '<span class="tp-pi">▶</span> 続ける' : '<span class="tp-pi">⏸</span> 止める';
    T.el.panel.classList.toggle('paused', T.paused);
  }
  function togglePause() {
    if (T.practice || T.finished) return;
    T.paused = !T.paused;
    setPauseUI();
  }
  function next() {
    if (T.finished || T.practice) return;
    if (T.idx >= SCENES.length - 1) return;
    T.paused = false;
    setPauseUI();
    T.skip = true; // いまの場面を一気に終わらせて、次の場面へ
  }
  function prev() {
    if (T.practice) return;
    goto(T.finished ? SCENES.length - 2 : Math.max(0, T.idx - 1));
  }
  function setSpeed(v) {
    T.speed = v;
    setSpeedUI();
  }
  function practice() {
    if (!T.on) return;
    T.token++; // 動いている場面を止める
    T.practice = true;
    T.paused = false;
    T.skip = false;
    T.fast = false;
    T.finished = false;
    clearStage();
    KH.grid.focus();
    setState('practice');
    if (T.el.title) T.el.title.textContent = '自分で触ってみましょう';
    if (T.el.body)
      T.el.body.innerHTML =
        '<p>練習用のデータです。<b>何をしても大丈夫</b>（保存されません）。</p>' +
        '<ol class="tp-todo"><li>マスをクリックして、<kbd>R</kbd> や <kbd>B</kbd> を押す</li><li><kbd>Enter</kbd> で、終わりの時刻を入れる</li><li><kbd>' + MOD + '</kbd>+<kbd>Z</kbd> で、元に戻す</li><li>右上の「まとめて ▾」「設定 ▾」も、のぞいてみる</li></ol>';
    if (T.el.step) T.el.step.textContent = '練習中';
    for (const d of T.el.dots.children) d.classList.remove('on');
    avoid([]);
  }
  function resetPractice() {
    if (!T.on) return;
    resetStage();
    practice();
    KH.app.toast('練習用のデータを、最初の状態にもどしました');
  }

  function onPanelClick(e) {
    const b = e.target.closest('[data-t]');
    if (!b || !T.on) return;
    switch (b.dataset.t) {
      case 'exit': return stop();
      case 'pause': return togglePause();
      case 'next': return next();
      case 'prev': return prev();
      case 'go': return goto(+b.dataset.i);
      case 'speed': return setSpeed(+b.dataset.v);
      case 'practice': return practice();
      case 'replay': return goto(0);
      case 'resetdata': return resetPractice();
    }
  }

  // デモ中は、本物のキー操作が、動いている画面にとどかないようにする（デモが乱れないように）
  function onKeyCapture(e) {
    if (!T.on || !e.isTrusted) return;
    if (T.practice || T.finished) return;
    if (e.key === 'Tab') return;
    if (T.el.panel && T.el.panel.contains(e.target) && (e.key === 'Enter' || e.key === ' ')) return; // ボタンの操作は通す
    if (e.key === 'Escape') { e.preventDefault(); e.stopPropagation(); stop(); return; }
    if (e.key === ' ') togglePause();
    else if (e.key === 'ArrowRight') next();
    else if (e.key === 'ArrowLeft') prev();
    e.preventDefault();
    e.stopPropagation();
  }
  function onResize() {
    syncDock();
    avoid([]);
  }

  // ───────── はじまり・おわり ─────────
  function start(opt) {
    opt = opt || {};
    if (T.on) return;
    T.on = true;
    T.token++;
    T.standalone = !!opt.standalone;
    T.practice = false;
    T.finished = false;
    T.paused = false;
    T.skip = false;
    T.fast = false;
    T.errors = [];
    T.saved = { view: KH.app.A.view, edit: KH.app.A.edit };
    // 開いている入力画面・メニューを閉じて、練習用のデータに切りかえる
    try { KH.editor.close(true); } catch (e) { /* なし */ }
    try { if (KH.dialogs.isOpen()) KH.dialogs.close(); } catch (e) { /* なし */ }
    KH.grid.reset();
    KH.app.A.view = 'grid';
    KH.app.A.edit = true;
    if (ST.inSandbox()) ST.resetSandbox(KH.demo.data());
    else ST.enterSandbox(KH.demo.data());
    buildUI();
    document.addEventListener('keydown', onKeyCapture, true);
    g.addEventListener('resize', onResize);
    document.body.classList.add('demo');
    renderStep();
    setState('play');
    goto(opt.at || 0); // at：途中の場面から始める（それより前は、画面の動きなしで一気に流す）
  }
  function stop() {
    if (!T.on) return;
    T.on = false;
    T.token++;
    document.removeEventListener('keydown', onKeyCapture, true);
    g.removeEventListener('resize', onResize);
    clearStage();
    removeUI();
    document.body.classList.remove('demo', 'tour-practice');
    if (ST.canLeaveSandbox()) {
      KH.grid.reset();
      if (T.saved) { KH.app.A.view = T.saved.view; KH.app.A.edit = T.saved.edit; }
      ST.exitSandbox();
    } else {
      // パスワードなしのデモ：本物のデータを読んでいないので、最初の画面（ロック画面）へ戻る
      g.location.reload();
    }
    KH.app.renderMain();
    KH.grid.focus();
  }

  KH.tour = {
    start,
    stop,
    goto,
    next,
    prev,
    practice,
    togglePause,
    setSpeed,
    isOn: () => T.on,
    scenes: () => SCENES.map((s) => s.title),
    state: () => ({ on: T.on, idx: T.idx, count: SCENES.length, paused: T.paused, practice: T.practice, finished: T.finished, fast: T.fast, speed: T.speed, errors: T.errors.slice(), side: T.side }),
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// データの暗号化（パスワードつきの公開ページ用）。ブラウザの標準の暗号機能（WebCrypto）だけを使う。
//   鍵づくり：PBKDF2（SHA-256・100万回）でパスワードから 256bit の鍵をつくる
//   暗号化　：AES-256-GCM（改ざんも検出できる）。パスワードがちがうと、ここで必ず失敗する
// 公開ページには「暗号になったデータ」だけが入る。パスワードを知らないと、中身（職員の名前・勤務）は読めない。
// ブラウザでも Node でも同じ形で動く（作る側 publish/build-public.mjs と、開く側 lock.js が同じ関数を使う）。
(function (g) {
  const KH = (g.KH = g.KH || {});
  const ITER = 1000000;
  const AAD = 'kinmu-hyo:v1';
  const te = new TextEncoder();
  const td = new TextDecoder();

  const subtle = () => (g.crypto && g.crypto.subtle) || null;
  // 全角で打っても・前後に空白が入っても同じになるようにそろえる
  const norm = (pw) => String(pw == null ? '' : pw).normalize('NFKC').trim();

  function b64(u8) {
    let s = '';
    for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000));
    return g.btoa(s);
  }
  function unb64(s) {
    const bin = g.atob(s);
    const u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    return u8;
  }

  async function deriveKey(pw, salt, iter, extractable) {
    const sub = subtle();
    if (!sub) throw new Error('no-crypto');
    const base = await sub.importKey('raw', te.encode(norm(pw)), 'PBKDF2', false, ['deriveKey']);
    return sub.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: iter }, base, { name: 'AES-GCM', length: 256 }, !!extractable, ['encrypt', 'decrypt']);
  }

  // obj（JSON にできるもの）をパスワードで暗号にして、公開してよい形（JSON）で返す
  async function seal(obj, pw, opt) {
    const iter = (opt && opt.iter) || ITER;
    const salt = g.crypto.getRandomValues(new Uint8Array(16));
    const iv = g.crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(pw, salt, iter, false);
    const ct = await subtle().encrypt({ name: 'AES-GCM', iv, additionalData: te.encode(AAD) }, key, te.encode(JSON.stringify(obj)));
    return { v: 1, kdf: 'PBKDF2-SHA256', alg: 'AES-256-GCM', iter, salt: b64(salt), iv: b64(iv), ct: b64(new Uint8Array(ct)) };
  }

  async function decryptWith(key, sealed) {
    const pt = await subtle().decrypt({ name: 'AES-GCM', iv: unb64(sealed.iv), additionalData: te.encode(AAD) }, key, unb64(sealed.ct));
    return JSON.parse(td.decode(pt));
  }

  // パスワードで開く。ちがえば Error（code: 'bad-password'）。opt.wantKey：このタブのあいだ覚えておく鍵も返す
  async function open(sealed, pw, opt) {
    const want = !!(opt && opt.wantKey);
    const key = await deriveKey(pw, unb64(sealed.salt), sealed.iter, want);
    let data;
    try {
      data = await decryptWith(key, sealed);
    } catch (e) {
      const err = new Error('bad-password');
      err.code = 'bad-password';
      throw err;
    }
    const out = { data };
    if (want) out.keyB64 = b64(new Uint8Array(await subtle().exportKey('raw', key)));
    return out;
  }

  // 覚えておいた鍵（keyB64）で開く（同じタブでの再読み込み用）
  async function openWithKey(sealed, keyB64) {
    const key = await subtle().importKey('raw', unb64(keyB64), { name: 'AES-GCM' }, false, ['decrypt']);
    return decryptWith(key, sealed);
  }

  KH.seal = { seal, open, openWithKey, norm, available: () => !!subtle(), ITER, b64, unb64 };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// 全体の組み立て：上の帯・メニュー・表示の切りかえ・保存の表示
(function (g) {
  const KH = (g.KH = g.KH || {});
  const U = KH.util;
  const M = KH.model;
  const ST = KH.store;
  const esc = U.esc;
  const A = { view: 'grid', edit: true, toastT: 0, menu: null };
  const $ = (id) => document.getElementById(id);
  const mo = () => ST.S.mo;

  const isEdit = () => A.edit;
  const view = () => A.view;

  function toast(msg) {
    const t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(A.toastT);
    A.toastT = setTimeout(() => t.classList.remove('show'), 2600);
  }

  // マスの説明（下の帯・ツールチップ用）
  function describeCell(m, cm, st, di, cell, html) {
    const e = html ? esc : (s) => s;
    const inf = M.cellInfo(m, cell, cm, st);
    const tag = cell && cell.tag ? m.tags.find((t) => t.id === cell.tag) : null;
    const colorName = (c) => (c ? '（' + (KH.COLORS.find((x) => x.id === c) || {}).name + '）' : '');
    let s = '';
    if (inf.kind === 'work') {
      const c = inf.code;
      s = (html ? '<b>' : '') + e(c.label + colorName(c.color)) + (html ? '</b>' : '') + ' ' + e(c.name ? c.name + ' ' : '') + e(c.start + '〜' + c.end);
      if (inf.changed) s += ' → ' + (html ? '<b style="color:#b3261e">' : '') + e(U.fmtTime(inf.s) + '〜' + U.fmtTime(inf.e)) + (html ? '</b>' : '');
    } else if (inf.kind === 'time') s = (html ? '<b>' : '') + '時間だけ' + (html ? '</b>' : '') + ' ' + e(M.timeText(inf));
    else if (inf.kind === 'off' || inf.kind === 'paid') s = (html ? '<b>' : '') + e(inf.code.label) + (html ? '</b>' : '') + ' ' + e(inf.code.name || '');
    else if (inf.kind === 'unknown') s = e(inf.label + '（設定にない記号）');
    else s = html ? '<span class="muted">（空）</span>' : '（空）';
    if (inf.adj) s += '（過不足 ' + U.fmtH(inf.adj, true) + '時間' + (inf.manual ? '・手入力' : '') + '）';
    if (cell && cell.xb) s += ' 休憩+' + cell.xb * 60 + '分';
    if (tag) s += ' ・' + e(tag.name);
    if (cell && cell.n) s += ' ・メモ「' + e(cell.n) + '」';
    return s;
  }

  // ───────── 上の帯 ─────────
  function updateHeader() {
    const m = mo();
    $('monthLabel').innerHTML = esc(U.wareki(m.y).replace(/^R/, '令和') + '年' + m.m + '月') + '<small>' + m.y + '年</small>';
    const k = $('kitei');
    if (document.activeElement !== k) k.value = m.kitei;
    for (const b of document.querySelectorAll('.tabs button')) b.classList.toggle('on', b.dataset.view === A.view);
    const mb = $('modeBtn');
    mb.textContent = A.edit ? '✎ 編集中' : '👁 見るだけ';
    mb.className = 'btn mode ' + (A.edit ? 'edit' : 'view');
    mb.title = A.edit ? 'クリックすると「見るだけ」（書きかえない）になります' : 'クリックすると編集できるようになります';
    $('undoBtn').disabled = !ST.S.undo.length;
    $('redoBtn').disabled = !ST.S.redo.length;
    $('undoBtn').title = ST.S.undo.length ? '元に戻す：' + ST.S.undo[ST.S.undo.length - 1].label + '（Ctrl+Z）' : '元に戻す（Ctrl+Z）';
    $('redoBtn').title = ST.S.redo.length ? 'やり直し：' + ST.S.redo[ST.S.redo.length - 1].label + '（Ctrl+Y）' : 'やり直し（Ctrl+Y）';
    $('bulkBtn').hidden = !(A.edit && A.view === 'grid');
    const keys = ST.monthKeys();
    const cur = U.monthKey(m.y, m.m);
    const i = keys.indexOf(cur);
    $('prevMonth').title = i > 0 ? '前の月（' + keys[i - 1] + '）' : '前の月をつくる';
    $('nextMonth').title = i < keys.length - 1 ? '次の月（' + keys[i + 1] + '）' : '次の月をつくる';
    document.body.classList.toggle('edit-mode', A.edit);
    document.body.classList.toggle('view-mode', !A.edit);
    // デモ（練習用のデータ）のあいだの表示
    const demo = ST.inSandbox();
    document.body.classList.toggle('demo', demo);
    $('demoBar').hidden = !demo;
    $('fileBtn').disabled = demo;
    $('fileBtn').title = demo ? 'デモのあいだは使えません' : '';
    $('demoBtn').hidden = demo;
    savedInfo();
  }

  function savedInfo() {
    const el = $('saved');
    if (ST.inSandbox()) { el.textContent = 'デモ中・保存なし'; el.className = 'saved'; el.title = 'デモのあいだは、何も保存されません'; return; }
    if (ST.S.saveError) { el.textContent = '⚠ 保存できません'; el.className = 'saved err'; el.title = 'ブラウザに保存できませんでした。「ファイル ▾ → ファイルに保存」で控えを残してください'; return; }
    el.className = 'saved';
    if (ST.S.lastSaved) {
      const t = ST.S.lastSaved;
      el.textContent = '✓ 保存 ' + t.getHours() + ':' + String(t.getMinutes()).padStart(2, '0');
      el.title = 'このブラウザに自動で保存しています';
    } else {
      el.textContent = '';
    }
  }

  function renderMain() {
    const main = $('main');
    KH.editor.close(true);
    if (A.view === 'grid') KH.grid.mount(main);
    else if (A.view === 'person') KH.views.renderPerson(main);
    else KH.views.renderDayView(main);
    KH.grid.renderDock();
    updateHeader();
  }

  function setView(v) {
    A.view = v;
    ST.pref('view', v);
    renderMain();
  }
  function openPerson(id) {
    ST.pref('person', id);
    setView('person');
  }
  function openDay(d) {
    ST.pref('day', d);
    setView('day');
  }
  function setEdit(on) {
    A.edit = on;
    ST.pref('edit', on);
    renderMain();
    toast(on ? '編集できます' : '見るだけになりました（名前で個人、日付でその日の配置が見られます）');
  }

  function undo() {
    KH.editor.close(true);
    const l = ST.undo();
    toast(l ? '元に戻しました：' + l : 'これ以上は戻せません');
  }
  function redo() {
    KH.editor.close(true);
    const l = ST.redo();
    toast(l ? 'やり直しました：' + l : 'やり直すことはありません');
  }

  // ───────── メニュー ─────────
  function menu(anchor, items) {
    closeMenu();
    const el = document.createElement('div');
    el.className = 'menu';
    el.innerHTML = items.map((it, i) => {
      if (it === '-') return '<hr>';
      if (it.header) return '<div class="mh">' + esc(it.header) + '</div>';
      return '<button data-i="' + i + '" class="' + (it.cur ? 'cur' : '') + '"' + (it.disabled ? ' disabled style="opacity:.45"' : '') + '>' + esc(it.label) + (it.right ? '<span class="r">' + esc(it.right) + '</span>' : '') + '</button>';
    }).join('');
    document.body.appendChild(el);
    const r = anchor.getBoundingClientRect();
    const w = el.offsetWidth;
    el.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, r.left)) + 'px';
    el.style.top = r.bottom + 6 + 'px';
    el.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-i]');
      if (!b || b.disabled) return;
      const it = items[+b.dataset.i];
      closeMenu();
      it.act && it.act();
    });
    A.menu = el;
    A.menuOff = (e) => { if (!el.contains(e.target) && e.target !== anchor && !anchor.contains(e.target)) closeMenu(); };
    setTimeout(() => document.addEventListener('mousedown', A.menuOff, true), 0);
  }
  function closeMenu() {
    if (A.menu) { A.menu.remove(); A.menu = null; document.removeEventListener('mousedown', A.menuOff, true); }
  }

  function monthMenu() {
    const keys = ST.monthKeys();
    const cur = U.monthKey(mo().y, mo().m);
    const items = [{ header: '月をえらぶ' }];
    for (const k of keys.slice().reverse()) {
      const p = U.parseMonthKey(k);
      items.push({ label: U.wareki(p.y).replace(/^R/, '令和') + '年' + p.m + '月', right: p.y + '年', cur: k === cur, act: () => ST.switchMonth(k) });
    }
    items.push('-', { label: '＋ 新しい月をつくる…', act: () => KH.dialogs.newMonth() }, { label: 'この月を削除…', act: () => KH.dialogs.deleteMonth() });
    menu($('monthLabel'), items);
  }

  function stepMonth(n) {
    const keys = ST.monthKeys();
    const m = mo();
    const cur = U.monthKey(m.y, m.m);
    const i = keys.indexOf(cur);
    const j = i + n;
    if (j >= 0 && j < keys.length) return ST.switchMonth(keys[j]);
    const t = U.addMonth(m.y, m.m, n);
    KH.dialogs.newMonth(t.y, t.m);
  }

  function fileMenu() {
    const m = mo();
    menu($('fileBtn'), [
      { label: '💾 ファイルに保存（全部の月）', act: () => { KH.views.download('勤務割表データ_' + new Date().toISOString().slice(0, 10) + '.json', ST.exportJSON(), 'application/json'); toast('保存ファイルを書き出しました（ダウンロードフォルダ）'); } },
      { label: '📂 保存ファイルを開く…', act: () => KH.dialogs.importFile() },
      '-',
      { label: '📊 表計算用（CSV）に書き出す（この月）', act: () => KH.views.download('勤務割表_' + m.y + '年' + m.m + '月.csv', KH.views.csv(m), 'text/csv') },
      { label: '🖨 印刷する…', right: 'Ctrl+P', act: () => KH.print.open() },
      '-',
      { label: '最初の状態（原本の10月）に戻す…', act: () => { if (confirm('入れた内容をすべて消して、最初の状態（原本の R8年10月）に戻しますか？\n（元に戻す で戻せます。念のため先に「ファイルに保存」がおすすめです）')) ST.resetAll(); } },
    ].concat(KH.lock ? ['-', { label: '🔒 ロックして閉じる（パスワード画面にもどる）', act: () => KH.lock.lockNow() }] : []));
  }

  function setMenu() {
    menu($('setBtn'), [
      { label: '👥 職員（名前・区分・いつもの勤務）…', act: () => KH.dialogs.staff() },
      { label: '🔤 勤務記号と色…', act: () => KH.dialogs.codes() },
      { label: '📅 この月の設定（規定時間・押印欄）…', act: () => KH.dialogs.monthSettings() },
    ]);
  }

  function bulkMenu() {
    const t = KH.grid.selTargets();
    menu($('bulkBtn'), [
      { label: '🔁 正職員のローテーションを下書きする…', act: () => KH.dialogs.rotation() },
      { label: 'いつもの勤務で、空いている平日を埋める', act: () => {
        let n = 0;
        ST.commit('いつもの勤務で埋める', (mm) => { n = M.fillDefaults(mm); });
        toast(n ? n + 'マスを「いつもの勤務」で埋めました' : '埋める所はありませんでした（職員の設定で「いつもの勤務」を決めると使えます）');
      } },
      { label: '空いている土曜日を「休」で埋める', act: () => {
        let n = 0;
        ST.commit('土曜日を休に', (mm) => {
          const off = M.offCodeId(mm);
          for (const di of M.dayInfos(mm)) {
            if (di.type !== 'sat') continue;
            for (const st of mm.staff) {
              const row = mm.cells[st.id] || (mm.cells[st.id] = {});
              if (!row[di.d]) { row[di.d] = { c: off }; n++; }
            }
          }
        });
        toast(n ? n + 'マスを「休」にしました' : '空いている土曜日はありませんでした');
      } },
      '-',
      { label: '選んでいるマスを空にする（' + t.length + 'マス）', disabled: !t.length, act: () => KH.grid.clearSel() },
      { label: 'この月の勤務をぜんぶ消す…', act: () => {
        if (!confirm(mo().m + '月の勤務をすべて消しますか？（職員・記号・行事は残ります。元に戻す で戻せます）')) return;
        ST.commit('この月の勤務をぜんぶ消す', (mm) => { for (const st of mm.staff) mm.cells[st.id] = {}; });
      } },
    ]);
  }

  // ───────── はじめに ─────────
  // opt.demo：パスワードなしのデモ。保存済みのデータを読まず、架空のデータだけで始める
  function init(opt) {
    opt = opt || {};
    if (A.started) return;
    A.started = true;
    if (opt.demo) ST.startSandbox(KH.demo.data());
    else ST.load();
    A.view = ST.pref('view') || 'grid';
    A.edit = ST.pref('edit') !== false;
    ST.on((what) => {
      if (what === 'saved') return savedInfo();
      if (what === 'change') {
        if (A.view === 'grid') KH.grid.render();
        else renderMain();
        updateHeader();
        return;
      }
      if (what === 'month') renderMain();
    });
    $('prevMonth').onclick = () => stepMonth(-1);
    $('nextMonth').onclick = () => stepMonth(1);
    $('monthLabel').onclick = monthMenu;
    $('kitei').onchange = (e) => {
      const v = parseFloat(U.toHalf(e.target.value));
      if (isNaN(v)) { e.target.value = mo().kitei; return; }
      ST.commit('規定時間', (mm) => { mm.kitei = v; });
      toast('規定時間を ' + v + ' 時間にしました');
    };
    $('kitei').onkeydown = (e) => { if (e.key === 'Enter') e.target.blur(); };
    for (const b of document.querySelectorAll('.tabs button')) b.onclick = () => setView(b.dataset.view);
    $('modeBtn').onclick = () => setEdit(!A.edit);
    $('undoBtn').onclick = undo;
    $('redoBtn').onclick = redo;
    $('printBtn').onclick = () => (A.view === 'person' ? KH.print.person(ST.pref('person') || mo().staff[0].id) : KH.print.open());
    $('fileBtn').onclick = fileMenu;
    $('setBtn').onclick = setMenu;
    $('bulkBtn').onclick = bulkMenu;
    $('helpBtn').onclick = () => KH.dialogs.help();
    $('demoBtn').onclick = () => KH.tour.start();
    $('demoEnd').onclick = () => KH.tour.stop();
    KH.grid.bindGlobal();

    // どこにフォーカスがあっても効くキー
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && A.menu) { closeMenu(); return; }
      if (e.key === 'Escape' && KH.editor.isOpen()) { e.preventDefault(); KH.editor.close(); return; }
      const tag = (e.target && e.target.tagName) || '';
      const typing = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
      if (typing || e.defaultPrevented || KH.dialogs.isOpen() || KH.print.isOpen()) return;
      const mod = e.ctrlKey || e.metaKey;
      if (!mod) return;
      const k = e.key.toLowerCase();
      if (e.target.closest && e.target.closest('.grid-wrap, .pop')) return; // 表の中は表が受け持つ
      if (k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
      else if (k === 'y') { e.preventDefault(); redo(); }
      else if (k === 'p') { e.preventDefault(); $('printBtn').click(); }
    });
    window.addEventListener('pagehide', () => ST.saveNow());
    window.addEventListener('beforeunload', () => ST.saveNow());
    renderMain();
    if (opt.demo) KH.tour.start({ standalone: true });
  }

  KH.app = { init, isEdit, view, toast, describeCell, openPerson, openDay, setView, undo, redo, renderMain, A };
  // 公開ページ（パスワードつき）では、ロック画面（lock.js）が、開いたあとで init を呼ぶ
  document.addEventListener('DOMContentLoaded', () => { if (!g.KH_GATE) init(); });
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
// ロック画面（パスワードつきの公開ページだけで使う）。
// ・パスワードが合うと、暗号になっていた最初のデータをといて、アプリを始める
// ・「パスワードなしで使い方のデモを見る」は、架空のデータだけで動かす（本物のデータも、保存済みのデータも読まない）
// 公開ページの中には、暗号になったデータ（window.KH_SEALED）と、このアプリのコードしか入っていない。
(function (g) {
  const KH = (g.KH = g.KH || {});
  const SS_KEY = 'kinmu-hyo:unlock';
  const L = { el: null, busy: false };

  const store = {
    get() { try { return g.sessionStorage.getItem(SS_KEY); } catch (e) { return null; } },
    set(v) { try { g.sessionStorage.setItem(SS_KEY, v); } catch (e) { /* 覚えられなくても動く */ } },
    del() { try { g.sessionStorage.removeItem(SS_KEY); } catch (e) { /* なし */ } },
  };

  function view() {
    const el = document.createElement('div');
    el.id = 'lock';
    el.innerHTML =
      '<form class="lock-card" autocomplete="on">' +
      '<div class="lock-logo">勤</div>' +
      '<h1>勤務割表</h1>' +
      '<p>職員の名前と勤務が入っているため、<b>パスワード</b>が必要です。</p>' +
      '<label for="lockPw">パスワード</label>' +
      '<input id="lockPw" name="password" type="password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="lockErr">' +
      '<label class="lock-row"><input type="checkbox" id="lockShow"> 文字を表示する</label>' +
      '<label class="lock-row"><input type="checkbox" id="lockKeep" checked> このタブを閉じるまで覚えておく</label>' +
      '<div class="lock-err" id="lockErr" role="alert"></div>' +
      '<button class="lock-go" id="lockGo" type="submit">開く</button>' +
      '<div class="lock-demo"><button type="button" id="lockDemo">▶ パスワードなしで、使い方のデモを見る</button><small>架空のデータで動きます。本物のデータは出ません。</small></div>' +
      '<div class="lock-foot">データはこのページの中で暗号になっています。パスワードは、作った人に聞いてください。</div>' +
      '</form>';
    return el;
  }

  function msg(t) {
    const e = document.getElementById('lockErr');
    if (e) e.textContent = t || '';
  }
  function busy(on) {
    L.busy = on;
    const b = document.getElementById('lockGo');
    if (!b) return;
    b.disabled = on;
    b.textContent = on ? '確認しています…' : '開く';
  }

  function hide() {
    if (L.el) { L.el.remove(); L.el = null; }
  }

  function enter(data) {
    KH.realSeed = data;
    hide();
    KH.app.init();
  }

  async function submit(e) {
    if (e) e.preventDefault();
    if (L.busy) return;
    const pw = document.getElementById('lockPw').value;
    if (!pw.trim()) { msg('パスワードを入れてください。'); return; }
    msg('');
    busy(true);
    // 画面に「確認しています」を出してから、重い計算を始める
    await new Promise((r) => setTimeout(r, 30));
    try {
      const keep = document.getElementById('lockKeep').checked;
      const r = await KH.seal.open(g.KH_SEALED, pw, { wantKey: keep });
      if (keep && r.keyB64) store.set(r.keyB64);
      enter(r.data);
    } catch (err) {
      busy(false);
      if (err && err.code === 'bad-password') {
        msg('パスワードがちがうようです。もう一度入れてください。');
        const i = document.getElementById('lockPw');
        i.focus();
        i.select();
      } else if (err && err.message === 'no-crypto') {
        msg('このブラウザでは、パスワードの確認ができません。https:// から始まるアドレスで開いてください。');
      } else {
        msg('開けませんでした。ページを読み込み直してください。');
      }
    }
  }

  function show(note) {
    hide();
    L.el = view();
    document.body.appendChild(L.el);
    const f = L.el.querySelector('form');
    f.addEventListener('submit', submit);
    document.getElementById('lockShow').addEventListener('change', (e) => {
      document.getElementById('lockPw').type = e.target.checked ? 'text' : 'password';
    });
    document.getElementById('lockDemo').addEventListener('click', () => {
      hide();
      KH.app.init({ demo: true });
    });
    if (note) msg(note);
    setTimeout(() => { const i = document.getElementById('lockPw'); if (i) i.focus(); }, 0);
  }

  // 同じタブで読み込み直したときは、覚えておいた鍵で自動で開く
  async function boot() {
    if (!g.KH_SEALED) { KH.app.init(); return; }
    if (!KH.seal.available()) { show('このブラウザでは、パスワードの確認ができません。https:// から始まるアドレスで開いてください。'); return; }
    const k = store.get();
    if (k) {
      try {
        enter(await KH.seal.openWithKey(g.KH_SEALED, k));
        return;
      } catch (e) {
        store.del();
      }
    }
    show();
  }

  // 「ロックして閉じる」：覚えておいた鍵を消して、ロック画面に戻る
  function lockNow() {
    store.del();
    g.location.reload();
  }

  KH.lock = { boot, show, lockNow };
  document.addEventListener('DOMContentLoaded', boot);
})(typeof window !== 'undefined' ? window : globalThis);

</script>
</body>
